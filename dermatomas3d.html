<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mapa Corporal 3D</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#f1f5f9;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  #wrap{display:flex;height:100%;width:100%}
  #canvas{flex:1;min-width:0;position:relative;cursor:grab}
  #canvas:active{cursor:grabbing}
  #panel{width:320px;flex-shrink:0;background:#fff;border-left:1px solid #e2e8f0;
    padding:18px;overflow-y:auto}
  @media(max-width:780px){#wrap{flex-direction:column}#panel{width:100%;height:46%;border-left:0;border-top:1px solid #e2e8f0}}
  #hint{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);
    border:1px solid #e2e8f0;border-radius:10px;padding:7px 11px;font-size:11px;color:#64748b}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#64748b;background:#f1f5f9}
  .chip{display:inline-block;padding:3px 9px;border-radius:8px;font-size:12px;font-weight:700;color:#fff}
  .card{border:2px solid;border-radius:16px;padding:14px;margin-bottom:14px}
  .lbl{font-size:11px;font-weight:600;color:#64748b;margin-bottom:2px}
  .val{font-size:13px;color:#1e293b;margin-bottom:9px;line-height:1.45}
  h2{font-size:14px;color:#1e293b;margin-bottom:3px}
  .sub{font-size:11px;color:#94a3b8;margin-bottom:13px}
  .grid{display:flex;flex-wrap:wrap;gap:5px}
  .lv{padding:4px 9px;border-radius:8px;font-size:11px;font-weight:700;
    border:1px solid #e2e8f0;background:#fff;color:#64748b;cursor:pointer;transition:.15s}
  .lv:hover{border-color:#cbd5e1}
  .note{font-size:10.5px;color:#94a3b8;line-height:1.5;margin-top:12px;
    border-top:1px solid #f1f5f9;padding-top:10px}
  .btn{padding:5px 11px;border-radius:9px;font-size:11px;font-weight:600;border:1px solid #e2e8f0;
    background:#fff;color:#475569;cursor:pointer;margin:0 5px 5px 0}
  .btn:hover{background:#f8fafc}
  .btn.on{background:#0f172a;border-color:#0f172a;color:#fff}
  .tabs{display:flex;gap:3px;background:#f1f5f9;border-radius:11px;padding:4px;margin-bottom:13px}
  .tab{flex:1;padding:6px 4px;border:0;border-radius:8px;background:transparent;cursor:pointer;
    font-size:10.5px;font-weight:600;color:#64748b;transition:.15s}
  .tab.on{background:#fff;color:#0f172a;box-shadow:0 1px 2px rgba(0,0,0,.06)}
</style>
</head>
<body>
<div id="wrap">
  <div id="canvas">
    <div id="hint">Arrastra para girar · rueda para acercar · clic en el cuerpo</div>
    <div id="loading">Cargando modelo anatómico…</div>
  </div>
  <div id="panel">
    <h2 id="titulo">Mapa corporal 3D</h2>
    <div class="sub" id="subtitulo">Haz clic en cualquier zona del cuerpo</div>

    <div class="tabs">
      <button class="tab on" data-m="derm"  onclick="setModo('derm')">Dermatomas</button>
      <button class="tab"    data-m="nervio" onclick="setModo('nervio')">N. periférico</button>
      <button class="tab"    data-m="mio"   onclick="setModo('mio')">Miotomas</button>
    </div>

    <div style="margin-bottom:12px">
      <button class="btn" onclick="verFrente()">Frente</button>
      <button class="btn" onclick="verEspalda()">Espalda</button>
      <button class="btn" id="btnTodo" onclick="toggleVerTodo()">Ver todo</button>
      <button class="btn" id="btnRef" onclick="toggleReflejos()">Reflejos</button>
    </div>

    <div id="detalle"></div>
    <div class="lbl" style="margin-bottom:6px" id="tituloLista">Ir a</div>
    <div class="grid" id="niveles"></div>
    <p class="note" id="nota"></p>
    <p class="note" style="border:0;padding-top:4px">
      Modelo: malla base de MakeHuman (dominio público, CC0).
    </p>
  </div>
</div>

  CPM:   {g:'Lumbosacro', n:'Cutáneo posterior del muslo', t:'Cara posterior del muslo hasta el hueco poplíteo.', r:'S1–S3', m:'—'},

  PERPRO:{g:'Lumbosacro', n:'Peroneo profundo', t:'PRIMER ESPACIO INTERDIGITAL dorsal — territorio pequeño y muy característico.', r:'L4–S1', m:'PIE CAÍDO. El peroneo común se comprime en el cuello del peroné. Diferenciarlo de radiculopatía L5.'},

  PUDEN: {g:'Lumbosacro', n:'Pudendo', t:'Región perineal y genital.', r:'S2–S4', m:'Su afectación bilateral indica síndrome de cauda equina.'},

const NERV_SERIE = {
  'Craneal':['TRIG','OCCI'], 'Cervical':['PLEXC'],
  'Braquial':['AXIL','MUSCU','RADIAL','MEDIANO','CUBITAL','CMB'],
  'Torácico':['INTERC','ILIO'],
  'Lumbosacro':['FCL','FEMORAL','SAFENO','OBTUR','CPM','PERSUP','PERPRO','SURAL','TIBIAL','PUDEN'],
};

// ── 3. Miotomas (músculos clave por raíz) ──
const MIO = {
  C34: {g:'Cervical', n:'C3–C5', t:'Diafragma.', r:'—', m:'Lesión por encima de C4: compromiso respiratorio. "C3-4-5 mantienen vivo al diafragma".'},
  C5:  {g:'Cervical', n:'C5', t:'Deltoides y bíceps — abducción del hombro y flexión del codo.', r:'Bicipital', m:'Evaluar: abducir el hombro contra resistencia.'},
  C6:  {g:'Cervical', n:'C6', t:'Extensores de muñeca y bíceps.', r:'Braquiorradial', m:'Evaluar: extender la muñeca contra resistencia.'},

  ABD: {g:'Dorsal', n:'D7–D12', t:'Musculatura abdominal.', r:'Cutáneos abdominales', m:'Signo de Beevor: el ombligo se desplaza hacia arriba con lesión por debajo de D10.'},
  L2:  {g:'Lumbar', n:'L2', t:'Psoas ilíaco — flexión de la cadera.', r:'—', m:'Evaluar: elevar el muslo sentado contra resistencia.'},
  L3:  {g:'Lumbar', n:'L3', t:'Cuádriceps — extensión de la rodilla.', r:'Rotuliano', m:'Evaluar: extender la rodilla contra resistencia.'},
  L4:  {g:'Lumbar', n:'L4', t:'Tibial anterior — dorsiflexión del tobillo.', r:'Rotuliano', m:'Evaluar: caminar sobre los talones.'},
  L5:  {g:'Lumbar', n:'L5', t:'Extensor largo del primer dedo — extensión del hallux.', r:'—', m:'Evaluar: extender el dedo gordo contra resistencia. Su debilidad da PIE CAÍDO.'},
  S1:  {g:'Sacro', n:'S1', t:'Gastrocnemio y sóleo — flexión plantar.', r:'Aquíleo', m:'Evaluar: caminar de puntillas. Es el más sensible para radiculopatía S1.'},
  S24: {g:'Sacro', n:'S2–S4', t:'Esfínteres anal y vesical.', r:'Bulbocavernoso, anal', m:'Su compromiso define el síndrome de cauda equina: urgencia quirúrgica.'},

const MIO_SERIE = {
  'Cervical':['C34','C5','C6','C7','C8'], 'Dorsal':['D1','ABD'],
  'Lumbar':['L2','L3','L4','L5'], 'Sacro':['S1','S24'],
};

// ── 4. Reflejos como puntos sobre el cuerpo ──
// [x, y, z, nombre, raíz, cómo explorarlo]
const REFLEJOS = [
  [ 2.9,11.55, 0.55,'Bicipital','C5–C6','Percutir el tendón del bíceps en el pliegue del codo, sobre el pulgar del explorador.'],
  [ 3.9,10.55, 0.45,'Braquiorradial','C5–C6','Percutir el radio distal, unos 5 cm por encima de la muñeca.'],
  [ 2.9,11.55,-0.75,'Tricipital','C7–C8','Percutir el tendón del tríceps justo por encima del olécranon.'],

];

// ═══════════════════════════════════════════════════════════════════════════
// PALETA
// ═══════════════════════════════════════════════════════════════════════════
const TONO = {
  'Trigémino':38,'Cervical':174,'Dorsal':217,'Lumbar':262,'Sacro':330,
  'Craneal':38,'Braquial':174,'Torácico':217,'Lumbosacro':280,
};
function hsl2hex(h,s,l){
  s/=100; l/=100;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r,g,b;
  if(h<60)[r,g,b]=[c,x,0]; else if(h<120)[r,g,b]=[x,c,0]; else if(h<180)[r,g,b]=[0,c,x];
  else if(h<240)[r,g,b]=[0,x,c]; else if(h<300)[r,g,b]=[x,0,c]; else [r,g,b]=[c,0,x];
  const q=v=>Math.round((v+m)*255).toString(16).padStart(2,'0');
  return '#'+q(r)+q(g)+q(b);
}
function construirColores(serie){
  const C={};
  for (const [reg,lista] of Object.entries(serie)){
    const h=TONO[reg]!==undefined?TONO[reg]:200;
    lista.forEach((k,i)=>{
      const t=lista.length>1?i/(lista.length-1):0.5;
      C[k]={off:hsl2hex(h,52,77-t*24), on:hsl2hex(h,85,42)};
    });
  }
  return C;
}

// ═══════════════════════════════════════════════════════════════════════════
// GEOMETRÍA — referencias medidas sobre esta malla (pies Y=0, altura 16.66)
// ═══════════════════════════════════════════════════════════════════════════
const A = { HOMBRO_X:2.0, HOMBRO_Y:13.63, MANO_X:4.96, MANO_Y:9.9,
            CLAVICULA:13.2, INGLE:8.0, RODILLA:4.6 };
const TRONCO = [['D2',12.60],['D3',12.20],['D4',11.80],['D5',11.45],['D6',11.05],
                ['D7',10.70],['D8',10.40],['D9',10.15],['D10',9.85],['D11',9.40],['D12',8.60]];
const _ax=A.MANO_X-A.HOMBRO_X, _ay=A.MANO_Y-A.HOMBRO_Y;
const ALEN=Math.hypot(_ax,_ay), UX=_ax/ALEN, UY=_ay/ALEN, NX=-UY, NY=UX;

function ejeBrazo(x,y){
  const ax=Math.abs(x), dx=ax-A.HOMBRO_X, dy=y-A.HOMBRO_Y;
  const t=(dx*UX+dy*UY)/ALEN, perp=dx*NX+dy*NY;
  if (t>0.02 && t<1.35 && Math.abs(perp)<2.4 && ax>1.55) return {t,perp};
  return null;
}

// ── Clasificadores ──
function clDerm(x,y,z,pm,NB,PX,PZ,C){
  const ax=Math.abs(x);
  const b=ejeBrazo(x,y);
  if (b){
    const k=Math.min(NB-1,Math.max(0,Math.floor(b.t*NB))), p=b.perp-pm[k];
    if (b.t<0.38) return p>0?'C5':'D1';
    if (b.t<0.80){ if(p>0.22)return 'C6'; if(p<-0.22)return 'C8'; return 'C7'; }
    if (p>0.15) return 'C6'; if (p<-0.15) return 'C8'; return 'C7';
  }
  if (y>14.75) return z>0.15?'V':'C2';
  if (y>14.05) return 'C3';
  if (y>A.CLAVICULA) return 'C4';
  if (y>A.INGLE){
    if (y<9.4 && z<PZ+0.4) return y<8.7?'S2':'D12';
    for (const [k,yt] of TRONCO) if (y>yt) return k;
    return 'D12';
  }
  if (y>7.2 && ax<0.75) return 'S345';
  if (y>6.5) return 'L1';
  if (y>A.RODILLA+0.9) return (z-PZ)<-0.5?'S2':'L2';
  if (y>A.RODILLA-0.6) return 'L3';
  if (y<1.1){                                    // pie, con su propio centro
    const fx=ax-C.pie.x, fz=z-C.pie.z;
    if (fz>0.10) return 'L5';                    // dorso
    return fx<-0.20?'L4':'S1';                   // borde medial / lateral y talón
  }
  const dx=ax-C.pant.x, dz=z-C.pant.z;
  if (dz<-0.35) return 'S1';
  if (dx<-0.10) return 'L4';
  return 'L5';
}

function clNervio(x,y,z,pm,NB,PX,PZ,C){
  const ax=Math.abs(x);
  const b=ejeBrazo(x,y);
  if (b){
    const k=Math.min(NB-1,Math.max(0,Math.floor(b.t*NB))), p=b.perp-pm[k];
    const post = z < -0.25;                       // cara posterior del miembro
    if (b.t<0.22) return p>0?'AXIL':'CMB';        // hombro/deltoides
    if (b.t<0.42){ if(post)return 'RADIAL'; return p>0?'AXIL':'CMB'; }
    if (b.t<0.80){                                 // antebrazo
      if (post) return 'RADIAL';
      if (p>0.2)  return 'MUSCU';
      if (p<-0.2) return 'CMB';
      return 'RADIAL';
    }
    if (post) return p>0?'RADIAL':'CUBITAL';       // dorso de la mano
    return p<-0.12?'CUBITAL':'MEDIANO';            // palma
  }
  if (y>14.75) return z>0.15?'TRIG':'OCCI';
  if (y>13.6)  return 'PLEXC';
  if (y>A.CLAVICULA) return 'PLEXC';
  if (y>A.INGLE){
    if (y<8.9) return 'ILIO';
    return 'INTERC';
  }
  if (y>7.2 && ax<0.75) return 'PUDEN';

  if (y>A.RODILLA-0.6){                            // ── muslo (centro propio) ──
    const dx=ax-C.muslo.x, dz=z-C.muslo.z;
    if (y>7.4 && dz>0.55) return 'ILIO';           // pliegue inguinal
    if (dz<-0.35) return 'CPM';                    // cara posterior
    if (dx>0.10)  return 'FCL';                    // cara lateral → meralgia
    if (dx<-0.45) return 'OBTUR';                  // cara medial
    return 'FEMORAL';                              // cara anterior
  }
  if (y<1.1){                                      // ── pie (centro propio) ──
    const dx=ax-C.pie.x, dz=z-C.pie.z;
    if (y<0.34) return 'TIBIAL';                   // planta (solo la cara inferior)
    if (dx>0.20) return 'SURAL';                   // borde lateral y talón
    if (dz>0.30 && dx>-0.35 && dx<0.05) return 'PERPRO'; // 1.er espacio interdigital
    if (dz>0.05) return 'PERSUP';                  // dorso
    return dx<-0.20?'SAFENO':'SURAL';
  }
  const dx=ax-C.pant.x, dz=z-C.pant.z;             // ── pantorrilla ──
  if (dz<-0.35) return 'SURAL';                    // posterior
  if (dx<-0.10) return 'SAFENO';                   // cara medial
  return 'PERSUP';                                 // anterolateral
}

function clMio(x,y,z,pm,NB,PX,PZ,C){
  const ax=Math.abs(x);
  const b=ejeBrazo(x,y);
  if (b){
    const k=Math.min(NB-1,Math.max(0,Math.floor(b.t*NB))), p=b.perp-pm[k];
    const post = z < -0.25;
    if (b.t<0.40) return post?'C7':'C5';           // deltoides/bíceps vs tríceps
    if (b.t<0.80) return post?'C6':'C6';           // antebrazo: extensores
    return p<-0.15?'D1':'C8';                      // mano
  }
  if (y>14.05) return 'C34';
  if (y>A.CLAVICULA) return 'C5';
  if (y>A.INGLE) return y>11.0?'C34':'ABD';        // diafragma arriba, abdominales abajo
  if (y>7.2 && ax<0.75) return 'S24';
  const dz=z-C.pant.z;
  if (y>6.6) return 'L2';                          // psoas
  if (y>A.RODILLA-0.6) return 'L3';                // cuádriceps
  if (y<1.1) return (z-C.pie.z)>0.10?'L5':'S1';    // dorso del pie vs talón
  if (dz<-0.35) return 'S1';                       // pantorrilla
  return 'L4';                                     // tibial anterior
}

const MODOS = {
  derm:   {datos:DERM, serie:DERM_SERIE, cl:clDerm,
           titulo:'Dermatomas', sub:'Territorio sensitivo de cada raíz',
           lista:'Ir a un nivel',
           campos:[['Territorio sensitivo','t'],['Reflejo asociado','r'],['Músculo clave (miotoma)','m']],
           nota:'Los dermatomas se superponen entre niveles adyacentes, por lo que una raíz aislada rara vez produce anestesia completa de su territorio. La cara depende del trigémino (V), no de raíces espinales.'},
  nervio: {datos:NERV, serie:NERV_SERIE, cl:clNervio,
           titulo:'Nervios periféricos', sub:'Territorio cutáneo de cada nervio',
           lista:'Ir a un nervio',
           campos:[['Territorio cutáneo','t'],['Raíces de origen','r'],['Relevancia clínica','m']],
           nota:'Compara con la vista de dermatomas: si el déficit sigue un nervio y no una raíz, la lesión es periférica. El pulgar puede ser C6 o mediano; el dorso del pie, L5 o peroneo.'},
  mio:    {datos:MIO, serie:MIO_SERIE, cl:clMio,
           titulo:'Miotomas', sub:'Músculo clave inervado por cada raíz',
           lista:'Ir a una raíz',
           campos:[['Músculos','t'],['Reflejo','r'],['Cómo explorarlo','m']],
           nota:'Un miotoma recibe fibras de varias raíces, por eso una lesión radicular aislada suele dar debilidad parcial y no parálisis completa.'},
};

// ═══════════════════════════════════════════════════════════════════════════
// ESCENA
// ═══════════════════════════════════════════════════════════════════════════
let scene, camera, renderer, controls, malla;
let modo='derm', sel='L5', verRef=false, verTodo=false;
const asign={}, COLS={}, marcadores=[];
const cont=document.getElementById('canvas');
let _pm, _NB=12, _PX, _PZ, _C;

for (const k of Object.keys(MODOS)) COLS[k]=construirColores(MODOS[k].serie);

function init(){
  scene=new THREE.Scene(); scene.background=new THREE.Color(0xf1f5f9);
  camera=new THREE.PerspectiveCamera(38, cont.clientWidth/cont.clientHeight, 0.1, 200);
  camera.position.set(0,9,30);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(cont.clientWidth,cont.clientHeight);
  cont.appendChild(renderer.domElement);
  controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=.08;
  controls.target.set(0,8.3,0); controls.minDistance=12; controls.maxDistance=55;

  scene.add(new THREE.HemisphereLight(0xffffff,0xcbd5e1,0.95));
  const k1=new THREE.DirectionalLight(0xffffff,0.55); k1.position.set(6,14,12); scene.add(k1);
  const k2=new THREE.DirectionalLight(0xffffff,0.3);  k2.position.set(-8,6,-10); scene.add(k2);

  new THREE.OBJLoader().load('./anatomia/cuerpo.obj', obj=>{
    obj.traverse(c=>{ if(c.isMesh) malla=c; });
    preparar(); scene.add(malla);
    crearMarcadores();
    document.getElementById('loading').remove();
    pintar();
  }, undefined, e=>{
    document.getElementById('loading').textContent='No se pudo cargar el modelo.';
    console.error(e);
  });

  renderer.domElement.addEventListener('pointerdown',onDown);
  renderer.domElement.addEventListener('pointerup',onUp);
  addEventListener('resize',onResize);
  animate();
}

function preparar(){
  const g=malla.geometry; g.computeVertexNormals();
  const pos=g.attributes.position, n=pos.count;

  // Centrado empírico. Cada segmento del miembro inferior tiene su propio centro:
  // el muslo, la pantorrilla y el pie no están alineados en X ni en Z, y usar un
  // único centro desplazaba los territorios (el pie sobre todo, que apunta hacia +Z).
  const bs=Array.from({length:_NB},()=>({s:0,c:0}));
  const seg={muslo:{x:0,z:0,n:0}, pant:{x:0,z:0,n:0}, pie:{x:0,z:0,n:0}};
  for(let i=0;i<n;i++){
    const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i), ax=Math.abs(x);
    const b=ejeBrazo(x,y);
    if(b){ const k=Math.min(_NB-1,Math.max(0,Math.floor(b.t*_NB))); bs[k].s+=b.perp; bs[k].c++; continue; }
    if(ax<0.3) continue;
    let s=null;
    if(y>5.2 && y<7.6) s='muslo';
    else if(y>1.3 && y<A.RODILLA-0.6) s='pant';
    else if(y<1.1) s='pie';
    if(s){ seg[s].x+=ax; seg[s].z+=z; seg[s].n++; }
  }
  _pm=bs.map(b=>b.c?b.s/b.c:0);
  const cen=o=>o.n?{x:o.x/o.n,z:o.z/o.n}:{x:1.85,z:-1.10};
  _C={muslo:cen(seg.muslo), pant:cen(seg.pant), pie:cen(seg.pie)};
  _PX=_C.pant.x; _PZ=_C.pant.z;

  for(const k of Object.keys(MODOS)){
    const f=MODOS[k].cl, arr=new Array(n);
    for(let i=0;i<n;i++) arr[i]=f(pos.getX(i),pos.getY(i),pos.getZ(i),_pm,_NB,_PX,_PZ,_C);
    asign[k]=arr;
  }
  g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(n*3),3));
  malla.material=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.72,metalness:.02});
}

function crearMarcadores(){
  const geo=new THREE.SphereGeometry(0.34,16,12);
  REFLEJOS.forEach(([x,y,z,nom,raiz,como])=>{
    [1,-1].forEach(s=>{
      const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xf59e0b,emissive:0x7c2d12,emissiveIntensity:.25,roughness:.4}));
      m.position.set(x*s,y,z);
      m.userData={nom,raiz,como}; m.visible=false;
      scene.add(m); marcadores.push(m);
    });
  });
}

function hex2rgb(h){ const v=parseInt(h.slice(1),16); return [(v>>16&255)/255,(v>>8&255)/255,(v&255)/255]; }

// Gris neutro para las zonas no seleccionadas en modo enfoque
const APAGADO = '#dfe5ec';

function pintar(){
  if(!malla) return;
  const col=malla.geometry.attributes.color, arr=asign[modo], C=COLS[modo];
  for(let i=0;i<arr.length;i++){
    const k=arr[i], c=C[k];
    let hex;
    if(!c) hex = APAGADO;
    else if(k===sel) hex = c.on;                 // la zona elegida, a todo color
    else hex = verTodo ? c.off : APAGADO;        // el resto: mapa completo o apagado
    const [r,g,b]=hex2rgb(hex);
    col.setXYZ(i,r,g,b);
  }
  col.needsUpdate=true;
  panel();
}

function toggleVerTodo(){
  verTodo=!verTodo;
  document.getElementById('btnTodo').classList.toggle('on',verTodo);
  pintar();
}

function panel(){
  const M=MODOS[modo], d=M.datos[sel], c=COLS[modo][sel];
  document.getElementById('titulo').textContent=M.titulo;
  document.getElementById('subtitulo').textContent=M.sub;
  document.getElementById('tituloLista').textContent=M.lista;
  document.getElementById('nota').textContent=M.nota;
  if(!d){ document.getElementById('detalle').innerHTML=''; return; }
  const etiqueta = d.n || (sel==='S345'?'S3–S5':sel);
  document.getElementById('detalle').innerHTML=`
    <div class="card" style="border-color:${c.on};background:${c.off}44">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap">
        <span class="chip" style="background:${c.on}">${etiqueta}</span>
        <span style="font-size:12px;font-weight:600;color:${c.on}">${d.g}</span>
      </div>
      ${M.campos.map(([lab,key])=>`<div class="lbl">${lab}</div><div class="val">${d[key]||'—'}</div>`).join('')}
    </div>`;
  document.querySelectorAll('#niveles .lv').forEach(b=>{
    const k=b.dataset.k, c2=COLS[modo][k], on=k===sel;
    b.style.background=on?c2.on:'#fff';
    b.style.borderColor=on?c2.on:'#e2e8f0';
    b.style.color=on?'#fff':'#64748b';
  });
}

function listaBotones(){
  const M=MODOS[modo];
  const claves=Object.values(M.serie).flat();
  document.getElementById('niveles').innerHTML=claves.map(k=>{
    const d=M.datos[k];
    const et=d&&d.n?d.n:(k==='S345'?'S3–S5':k);
    return `<button class="lv" data-k="${k}" onclick="seleccionar('${k}')">${et}</button>`;
  }).join('');
}

function seleccionar(k){ sel=k; pintar(); }

function setModo(m){
  modo=m;
  sel=Object.values(MODOS[m].serie).flat()[m==='derm'?24:0];
  if(m==='nervio') sel='PERPRO';
  if(m==='mio')    sel='S1';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.m===m));
  listaBotones(); pintar();
}

function toggleReflejos(){
  verRef=!verRef;
  marcadores.forEach(m=>m.visible=verRef);
  document.getElementById('btnRef').classList.toggle('on',verRef);
  if(verRef) document.getElementById('detalle').insertAdjacentHTML('afterbegin',
    '<div class="note" style="border:0;margin:0 0 10px;padding:0;color:#b45309">Puntos naranjas: haz clic en uno para ver el reflejo.</div>');
}

// ── Interacción ──
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
let downAt=null;
function onDown(e){ downAt={x:e.clientX,y:e.clientY}; }
function onUp(e){
  if(!downAt||!malla) return;
  if(Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y)>5) return;
  const r=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;
  mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mouse,camera);
  if(verRef){
    const hm=ray.intersectObjects(marcadores)[0];
    if(hm){ const u=hm.object.userData;
      document.getElementById('detalle').innerHTML=`
        <div class="card" style="border-color:#f59e0b;background:#fffbeb">
          <div style="display:flex;align-items:center;gap:9px;margin-bottom:11px">
            <span class="chip" style="background:#d97706">Reflejo</span>
            <span style="font-size:13px;font-weight:700;color:#92400e">${u.nom}</span>
          </div>
          <div class="lbl">Raíz</div><div class="val">${u.raiz}</div>
          <div class="lbl">Cómo explorarlo</div><div class="val" style="margin-bottom:0">${u.como}</div>
        </div>`;
      return; }
  }
  const hit=ray.intersectObject(malla,true)[0];
  if(hit&&hit.face) seleccionar(asign[modo][hit.face.a]);
}

function verFrente(){ camera.position.set(0,9,30); controls.target.set(0,8.3,0); controls.update(); }
function verEspalda(){ camera.position.set(0,9,-30); controls.target.set(0,8.3,0); controls.update(); }
function onResize(){
  camera.aspect=cont.clientWidth/cont.clientHeight; camera.updateProjectionMatrix();
  renderer.setSize(cont.clientWidth,cont.clientHeight);
}
function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }

listaBotones();
init();
</script>
</body>
</html>
