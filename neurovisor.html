                container.appendChild(btn);
            });
        }

        function setAnatomy(anatomyStr) {
            currentAnatomy = anatomyStr;
            // Usar el primer ID del módulo como pathology inicial
            const defaultPathId = pathologies[anatomyStr][0].id;
            currentPathology = defaultPathId;

            document.querySelectorAll('.module-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`mod-${anatomyStr}`).classList.add('active');

            const pathContainer = document.getElementById('patho-buttons');
            pathContainer.innerHTML = '';
            pathologies[anatomyStr].forEach(p => {
                const btn = document.createElement('button');
                btn.className = `path-btn w-full p-2 text-left text-xs rounded border border-zinc-700 hover:bg-zinc-800 transition-colors ${p.id===defaultPathId?'bg-zinc-800 border-zinc-500 text-white':'text-zinc-400'}`;
                btn.innerText = p.name;
                btn.id = `path-${p.id}`;
                btn.onclick = () => setPathology(p.id);
                pathContainer.appendChild(btn);
            });

            isMobile = window.innerWidth <= 640;
            if(anatomyStr === 'brain') {
                camera.position.set(0, isMobile?6:3, isMobile?18:12);
                controls.target.set(0, 0.5, 0);
            } else if (anatomyStr === 'spine') {
                camera.position.set(isMobile?0:3, isMobile?3:1, isMobile?22:12);
                controls.target.set(0, 0, 0);
            } else {
                camera.position.set(12, 8, 12);
                controls.target.set(0, 0, 0);
                setPathology('admission');
            }
            controls.update();

            updateModel();
        }

        function setPathology(pathId) {
            currentPathology = pathId;
            document.querySelectorAll('.path-btn').forEach(b => {
                b.classList.remove('bg-zinc-800', 'border-red-500', 'text-white');
                b.classList.add('text-zinc-400', 'border-zinc-700');
            });
            const active = document.getElementById(`path-${pathId}`);
            if(active) {
                active.classList.remove('text-zinc-400', 'border-zinc-700');
                const normalPathId = pathologies[currentAnatomy][0].id;
                active.classList.add('bg-zinc-800', pathId===normalPathId?'border-zinc-500':'border-red-500', 'text-white');
            }

            const desc = document.getElementById('patho-desc');
            desc.innerText = descriptions[pathId] || "Etapa del viaje del paciente seleccionada.";

            updateModel();
        }

        function updateModel() {
            scene.remove(activeAnatomyGroup);
            if (currentAnatomy === 'brain') activeAnatomyGroup = generateBrain();
            else if (currentAnatomy === 'spine') activeAnatomyGroup = generateSpine();
            else activeAnatomyGroup = generateJourney();
            
            scene.add(activeAnatomyGroup);

            systemLayers.forEach(l => {
                activeAnatomyGroup.traverse(c => { if(c.userData && c.userData.layer === l.id) c.visible = l.active; });
            });

            update3DLabels();
        }

        // --- SISTEMA DE ETIQUETAS 3D -> 2D ---
        function clearLabels() {
            document.getElementById('labels-container').innerHTML = '';
            htmlLabels = [];
        }

        function update3DLabels() {
            clearLabels();
            if(currentAnatomy === 'journey') return; 
            
            const container = document.getElementById('labels-container');
            const data = labelsData[currentAnatomy];
            
            data.forEach((lbl, index) => {
                const el = document.createElement('div');
                el.className = 'anatomical-label';
                el.innerText = lbl.name;
                container.appendChild(el);
                
                let px = lbl.pos[0];
                if(currentAnatomy === 'brain' && (currentPathology==='tumor' || currentPathology==='hematoma')) px += 0.3;

                htmlLabels.push({ element: el, pos3D: new THREE.Vector3(px, lbl.pos[1], lbl.pos[2]) });
            });
        }

        function updateLabelPositions() {
            const W = renderer.domElement.clientWidth  || window.innerWidth;
            const H = renderer.domElement.clientHeight || window.innerHeight;
            htmlLabels.forEach(lbl => {
                const vector = lbl.pos3D.clone();
                vector.project(camera);

                const x = (vector.x * .5 + .5) * W;
                const y = (vector.y * -.5 + .5) * H;

                if(vector.z > 1) {
                    lbl.element.style.opacity = '0';
                } else {
                    lbl.element.style.opacity = '1';
                    lbl.element.style.left = `${x}px`;
                    lbl.element.style.top = `${y - 20}px`;
                }
            });
        }

        // --- BUCLE DE RENDERIZADO ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            animatedMeshes.forEach(item => {
                if(!item.mesh.visible) return;
                
                if(item.type === 'pulse') { 
                    const s = 1 + Math.sin(time * 8) * 0.15;
                    item.mesh.scale.set(s,s,s);
                } else if (item.type === 'breath') { 
                    item.mesh.rotation.y += 0.005;
                    const s = 1 + Math.sin(time * 2) * 0.02;
                    item.mesh.scale.set(s,s,s);
                } else if (item.type === 'glow') { 
                    item.mesh.material.emissiveIntensity = 0.5 + Math.sin(time * 5) * 0.5;
                } else if (item.type === 'ecg') { 
                    const color = Math.sin(time*10) > 0.8 ? 0xffffff : 0x00ff00;
                    item.mesh.material.color.setHex(color);
                }
            });

            if(htmlLabels.length > 0) updateLabelPositions();

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = initEngine;
    </script>
</body>
</html>
