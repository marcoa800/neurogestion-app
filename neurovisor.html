<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Motor Anatómico 3D - NeuroVisor Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --panel-bg: rgba(10, 10, 15, 0.85);
            --accent: #0ea5e9;
        }
        body { 
            margin: 0; overflow: hidden; background-color: var(--bg-dark); 
            color: #f8fafc; font-family: 'Inter', system-ui, sans-serif; 
            user-select: none;
        }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; }
        .pointer-events-auto { pointer-events: auto; }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        .layer-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid transparent; }
        .layer-btn.active { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
        .layer-btn:not(.active) { opacity: 0.5; filter: grayscale(80%); }

        .module-btn { transition: all 0.2s; border: 1px solid transparent; }
        .module-btn.active { background: #2563eb; border-color: #60a5fa; box-shadow: 0 0 15px rgba(37,99,235,0.4); }

        /* 3D Labels */
        .anatomical-label {
            position: absolute;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: opacity 0.3s;
            white-space: nowrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            z-index: 5;
        }
        .anatomical-label::after {
            content: ''; position: absolute; top: 100%; left: 50%;
            margin-left: -5px; border-width: 5px; border-style: solid;
            border-color: rgba(255, 255, 255, 0.2) transparent transparent transparent;
        }

        #loader { transition: opacity 0.5s; }
    </style>
</head>
<body>

    <div id="loader" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-zinc-950 pointer-events-auto">
        <i class="fa-solid fa-microscope text-5xl text-sky-500 mb-6 animate-pulse"></i>
        <h2 class="text-2xl font-light text-zinc-300 tracking-widest uppercase">Atlas 3D Cargando</h2>
        <p class="text-sm text-zinc-500 mt-2" id="loader-text">Descargando modelos anatómicos reales (HuBMAP CCF Atlas)...</p>
        <div class="w-64 h-1 bg-zinc-800 rounded-full mt-6 overflow-hidden">
            <div class="h-full bg-sky-500 w-full origin-left scale-x-0 transition-[transform] duration-700 ease-out" id="loader-bar"></div>
        </div>
    </div>

    <div id="canvas-container"></div>
    <div id="labels-container" class="absolute inset-0 pointer-events-none z-10 overflow-hidden"></div>

    <div id="ui-layer">
        <header class="glass-panel p-3 flex justify-between items-center pointer-events-auto border-b border-zinc-800">
            <div class="flex items-center gap-4">
                <div class="bg-gradient-to-br from-sky-500 to-blue-700 p-2 rounded-lg text-white shadow-[0_0_15px_rgba(14,165,233,0.5)]">
                    <i class="fa-solid fa-dna text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-tight leading-tight">ATLAS <span class="text-sky-400 font-light">PRO</span></h1>
                    <p class="text-[10px] text-zinc-400 uppercase tracking-widest font-semibold">Netter-Style Engine</p>
                </div>
            </div>
            
            <div class="text-[10px] text-zinc-500 uppercase tracking-widest font-semibold">NeuroGestión · Atlas Anatómico 3D</div>
        </header>

        <div class="flex-1 flex overflow-hidden">
            
            <aside class="glass-panel w-20 md:w-64 flex flex-col pointer-events-auto border-r border-zinc-800 z-20">
                
                <div class="p-2 md:p-4 border-b border-zinc-800">
                    <h2 class="text-[10px] md:text-xs font-bold text-zinc-500 uppercase tracking-widest mb-3 hidden md:block"><i class="fa-solid fa-cubes mr-2"></i> Módulos</h2>
                    <div class="flex flex-col gap-2">
                        <button onclick="setAnatomy('brain')" id="mod-brain" class="module-btn active bg-zinc-800 hover:bg-zinc-700 p-2 md:p-3 rounded-xl flex items-center justify-center md:justify-start gap-3">
                            <i class="fa-solid fa-brain text-lg"></i><span class="text-sm font-semibold hidden md:block">Cerebro</span>
                        </button>
                        <button onclick="setAnatomy('spine')" id="mod-spine" class="module-btn bg-zinc-800 hover:bg-zinc-700 p-2 md:p-3 rounded-xl flex items-center justify-center md:justify-start gap-3">
                            <i class="fa-solid fa-bone text-lg"></i><span class="text-sm font-semibold hidden md:block">Columna</span>
                        </button>
                        <button onclick="setAnatomy('journey')" id="mod-journey" class="module-btn bg-zinc-800 hover:bg-zinc-700 p-2 md:p-3 rounded-xl flex items-center justify-center md:justify-start gap-3">
                            <i class="fa-solid fa-hospital-user text-lg"></i><span class="text-sm font-semibold hidden md:block">Viaje Paciente</span>
                        </button>
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto p-2 md:p-4 flex flex-col gap-2" id="layer-controls">
                    <!-- JS inyecta botones de capas -->
                </div>
            </aside>

            <div class="flex-1 relative"></div>

            <aside id="clinical-panel" class="glass-panel w-72 md:w-80 flex flex-col pointer-events-auto border-l border-zinc-800 z-20">
                <div class="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-900/50">
                    <h2 class="text-xs font-bold text-sky-500 uppercase tracking-widest"><i class="fa-solid fa-file-medical mr-2"></i> Diagnóstico / Fase</h2>
                </div>
                <div class="p-5 overflow-y-auto flex-1">
                    <div id="info-pathology" class="bg-red-950/30 border border-red-900/50 p-4 rounded-xl">
                        <h4 class="text-xs uppercase text-red-400 font-bold mb-2 flex items-center"><i class="fa-solid fa-triangle-exclamation mr-1.5"></i> Seleccionar Evento</h4>
                        <div id="patho-buttons" class="flex flex-col gap-2 mb-4">
                            <!-- JS inyecta botones -->
                        </div>
                        <p id="patho-desc" class="text-sm text-red-200/90 leading-relaxed font-light mt-4 pt-4 border-t border-red-900/30"></p>
                    </div>

                </div>
            </aside>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // --- DATA DICTIONARY ---
        const systemLayers = [
            { id: 'bone', name: 'Óseo', icon: 'fa-skull', color: '#f0ebd8', active: true },
            { id: 'tissue', name: 'Nervioso/Tejido', icon: 'fa-brain', color: '#e8d5b5', active: true },
            { id: 'vessels', name: 'Vascular', icon: 'fa-droplet', color: '#cc1111', active: true },
            { id: 'pathology', name: 'Patología', icon: 'fa-virus', color: '#aaee22', active: true }
        ];

        const pathologies = {
            brain: [
                { id: 'normal', name: 'Cerebro Sano' },
                { id: 'aneurysm', name: 'Aneurisma Sacular' },
                { id: 'avm', name: 'Malformación Arteriovenosa' },
                { id: 'tumor', name: 'Glioblastoma Multiforme' },
                { id: 'hematoma', name: 'Hematoma Subdural' },
                { id: 'stroke', name: 'Infarto Isquémico (Ictus)' }
            ],
            spine: [
                { id: 'normal', name: 'Columna Sana' },
                { id: 'hernia', name: 'Hernia Discal (L4-L5)' },
                { id: 'stenosis', name: 'Estenosis del Canal' },
                { id: 'listesis', name: 'Espondilolistesis' },
                { id: 'wedge', name: 'Fractura por Compresión (Cuña)' },
                { id: 'burst', name: 'Fractura por Estallido' }
            ],
            journey: [
                { id: 'admission', name: '1. Admisión y Triaje' },
                { id: 'mri', name: '2. Resonancia Magnética (RMN)' },
                { id: 'surgery', name: '3. Intervención Quirúrgica' },
                { id: 'recovery', name: '4. Cuidados Intensivos (UCI)' },
                { id: 'rehab', name: '5. Fisioterapia y Rehabilitación' },
                { id: 'discharge', name: '6. Alta Médica' }
            ],
        };

        const descriptions = {
            // Cerebro
            aneurysm: "Dilatación focal de la pared arterial. En el modelo se observa en la arteria comunicante anterior, pulsando peligrosamente al ritmo cardíaco.",
            avm: "Nido vascular aberrante. Las arterias se conectan directamente con las venas sin red capilar intermedia, creando un enredo de vasos propensos a romperse.",
            tumor: "Masa neoplásica invasiva. Note el 'efecto de masa' que desplaza la línea media anatómica, comprimiendo el tejido cerebral sano adyacente.",
            hematoma: "Acumulación de sangre venosa entre la duramadre y la aracnoides. Tiene forma de media luna y ejerce presión difusa sobre el hemisferio.",
            stroke: "Muerte del tejido cerebral (necrosis isquémica) por falta de riego sanguíneo. Se observa un área pálida y degradada en el territorio de la arteria cerebral media.",
            
            // Columna
            hernia: "Extrusión del núcleo pulposo a través del anillo fibroso roto. Comprime mecánicamente la raíz nerviosa emergente, provocando radiculopatía.",
            stenosis: "Estrechamiento del canal medular provocado por el crecimiento de osteofitos (espolones óseos) y engrosamiento de los ligamentos, estrangulando los nervios.",
            listesis: "Desplazamiento anterior de una vértebra sobre la inferior debido a inestabilidad estructural, causando cizallamiento en el canal medular.",
            wedge: "Colapso de la porción anterior del cuerpo vertebral, dándole forma de cuña. Muy común en pacientes con osteoporosis avanzada.",
            burst: "Traumatismo axial severo. El cuerpo vertebral se fragmenta y la retropulsión ósea (esquirlas) invade el canal medular, amenazando la médula espinal.",
            
            // Viaje
            admission: "El paciente llega al centro. Se realizan las primeras evaluaciones neurológicas, estabilización de signos vitales y preparación preoperatoria.",
            mri: "Se obtienen imágenes detalladas del cerebro o columna utilizando potentes campos magnéticos para planificar la cirugía con precisión milimétrica.",
            surgery: "El equipo neuroquirúrgico interviene utilizando microscopios de alta resolución, neuronavegación y neuromonitoreo intraoperatorio.",
            recovery: "El paciente es trasladado a la UCI para un monitoreo estricto de la presión intracraneal, hemodinámica y despertar neurológico.",
            rehab: "Inicio de la movilización temprana. Fisioterapia motora y respiratoria para recuperar la fuerza, el equilibrio y la independencia funcional.",
            discharge: "El paciente alcanza la estabilidad neurológica y clínica necesaria para continuar su recuperación en casa con seguimiento ambulatorio."
        };

        // --- SISTEMA DE ETIQUETAS ANATÓMICAS ---
        const labelsData = {
            // Posiciones con rotación.y = π (frontal hacia +Z, occipital hacia -Z)
            brain: [
                { pos: [ 0.5, 3.5,  2.8], name: 'Lóbulo Frontal' },
                { pos: [-0.5, 4.5,  0.0], name: 'Lóbulo Parietal' },
                { pos: [ 3.2, 1.8,  0.5], name: 'Lóbulo Temporal' },
                { pos: [ 0.0, 1.0, -2.8], name: 'Cerebelo' },
                { pos: [ 0.0, 0.5, -1.2], name: 'Tronco Encefálico' }
            ],
            spine: [
                { pos: [0,  2.5, 0.8], name: 'Región Cervical (C3–C7)' },
                { pos: [0,  0.0, 0.8], name: 'Región Torácica' },
                { pos: [0, -3.0, 0.8], name: 'Región Lumbar (L1–L5)' },
                { pos: [0,  0.5,-1.0], name: 'Médula Espinal' },
                { pos: [-1.8, 0.0,-0.5], name: 'Raíces Nerviosas' },
            ],
        };
        let currentAnatomy = 'brain';
        let currentPathology = 'normal';
        let isMobile = window.innerWidth <= 640;
        let htmlLabels = [];

        // --- THREE.JS GLOBALS ---
        let scene, camera, renderer, controls;
        let activeAnatomyGroup = new THREE.Group();
        let clock = new THREE.Clock();
        let animatedMeshes = [];

        // --- MODELOS GLB REALES (HuBMAP CCF Atlas, CC BY 4.0 / BodyParts3D, CC BY-SA 2.1 Japan) ---
        // Allen_Brain.glb:  Allen Institute female brain surface (HuBMAP CCF v1.3)
        // Spinal_Cord.glb:  Visible Human Project female spinal cord (HuBMAP CCF v1.3)
        // Skull.glb:        Huesos craneales combinados (BodyParts3D / DBCLS)
        let brainGLB = null;
        let spinalCordGLB = null;
        let skullGLB = null;
        let spineColumnGLB = null;  // Columna real BodyParts3D (CC BY-SA 2.1 Japan)

        // --- MATEMÁTICAS PROCEDURALES ---
        function pseudo3DNoise(x, y, z) {
            const freq1 = 4.0; const freq2 = 8.0; const freq3 = 15.0;
            let n = Math.sin(x*freq1 + y*freq1)*Math.cos(y*freq1 + z*freq1)*Math.sin(z*freq1 + x*freq1);
            n += 0.5 * Math.sin(x*freq2)*Math.cos(y*freq2)*Math.sin(z*freq2);
            n += 0.25 * Math.sin(x*freq3)*Math.cos(y*freq3)*Math.sin(z*freq3);
            return n;
        }

        function createBoneTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#f2eed5'; ctx.fillRect(0,0,512,512);
            for(let i=0; i<10000; i++) {
                ctx.fillStyle = `rgba(0,0,0, ${Math.random()*0.1})`;
                ctx.beginPath(); ctx.arc(Math.random()*512, Math.random()*512, Math.random()*2, 0, Math.PI*2); ctx.fill();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // --- MATERIALES PBR HIPERREALISTAS ---
        const mats = {
            bone: new THREE.MeshPhysicalMaterial({ color: 0xe8e4cc, roughness: 0.8, metalness: 0.05, bumpMap: createBoneTexture(), bumpScale: 0.03 }),
            boneTransp: new THREE.MeshPhysicalMaterial({ color: 0xe8e4cc, roughness: 0.5, transparent: true, opacity: 0.15, depthWrite: false, side: THREE.DoubleSide }),
            tissue: new THREE.MeshPhysicalMaterial({ color: 0xd9baba, roughness: 0.3, metalness: 0.0, clearcoat: 1.0, clearcoatRoughness: 0.2, transmission: 0.1, thickness: 2.0 }),
            tissueExpert: new THREE.MeshPhysicalMaterial({ color: 0xd9baba, roughness: 0.3, transparent: true, opacity: 0.4, depthWrite: false }),
            tissueStroke: new THREE.MeshPhysicalMaterial({ color: 0x888899, roughness: 0.8, metalness: 0.0, clearcoat: 0.0 }), // Tejido muerto
            nerve: new THREE.MeshPhysicalMaterial({ color: 0xffd700, roughness: 0.5, metalness: 0.1, clearcoat: 0.5, clearcoatRoughness: 0.3 }),
            artery: new THREE.MeshPhysicalMaterial({ color: 0xcc0000, roughness: 0.2, metalness: 0.1, clearcoat: 1.0, clearcoatRoughness: 0.1 }),
            vein: new THREE.MeshPhysicalMaterial({ color: 0x0033aa, roughness: 0.2, metalness: 0.1, clearcoat: 1.0, clearcoatRoughness: 0.1 }),
            disc: new THREE.MeshPhysicalMaterial({ color: 0xbdc9d4, roughness: 0.7 }),
            tumor: new THREE.MeshPhysicalMaterial({ color: 0x73823d, roughness: 0.9, bumpScale: 0.2 }),
            hematoma: new THREE.MeshPhysicalMaterial({ color: 0x4a0000, roughness: 0.2, clearcoat: 0.8, transparent: true, opacity: 0.95 }),
            hernia: new THREE.MeshPhysicalMaterial({ color: 0xff1111, roughness: 0.2, emissive: 0x330000 })
        };

        // --- INICIALIZACIÓN ---
        function initEngine() {
            const container = document.getElementById('canvas-container');
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
            container.appendChild(renderer.domElement);

            scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x050505, 0.015);
            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05; controls.minDistance = 3; controls.maxDistance = 25;

            setupLighting();
            buildUI();

            // ── Precarga de modelos anatómicos GLB reales ───────────────────────
            // Normaliza un GLB al tamaño pedido y lo centra en origen.
            // Retorna un Group wrapper: clonarlo y setear wrapper.position == mover
            // el modelo sin romper la centración interna del GLB.
            function normalizeGLB(root, targetSize) {
                // Paso 1: escalar (pre-bbox para obtener escala)
                const box0 = new THREE.Box3().setFromObject(root);
                const size0 = box0.getSize(new THREE.Vector3());
                const maxDim = Math.max(size0.x, size0.y, size0.z);
                if(maxDim === 0) return root;
                const scale = targetSize / maxDim;
                root.scale.setScalar(scale);

                // Paso 2: centrar en origen — recompute bbox POST-escala
                const box1 = new THREE.Box3().setFromObject(root);
                const c = box1.getCenter(new THREE.Vector3());
                root.position.set(-c.x, -c.y, -c.z);

                // Paso 3: envolver en Group — geometry queda centrada en (0,0,0)
                // relativa al wrapper. Al clonar el wrapper y moverlo, la geometry
                // sigue exactamente al wrapper sin desviaciones.
                const wrapper = new THREE.Group();
                wrapper.add(root);
                return wrapper;
            }

            const gltfLoader = new THREE.GLTFLoader();
            const loaderText = document.getElementById('loader-text');
            const loaderBar  = document.getElementById('loader-bar');
            let loadedCount = 0;

            const onModelReady = () => {
                loadedCount++;
                loaderBar.style.transform = `scaleX(${loadedCount / 4})`;
                if(loadedCount >= 4) {
                    setAnatomy('brain');
                    document.getElementById('loader').style.opacity = '0';
                    setTimeout(() => document.getElementById('loader').style.display = 'none', 600);
                }
            };

            // Cerebro: Allen Institute Female Brain (HuBMAP CCF v1.3, CC BY 4.0)
            if(loaderText) loaderText.innerText = 'Cargando cerebro — Allen Institute (HuBMAP CCF)...';
            gltfLoader.load('./Allen_Brain.glb', (gltf) => {
                brainGLB = normalizeGLB(gltf.scene, 6.5);   // wrapper centrado en (0,0,0)
                if(loaderText) loaderText.innerText = 'Cargando médula — Visible Human Project...';
                onModelReady();
            }, undefined, (err) => {
                console.warn('[NeuroAtlas] Allen Brain no disponible, usando geometría procedural.', err);
                onModelReady();
            });

            // Médula Espinal: Visible Human Female Spinal Cord (HuBMAP CCF v1.3, CC BY 4.0)
            gltfLoader.load('./Spinal_Cord.glb', (gltf) => {
                spinalCordGLB = normalizeGLB(gltf.scene, 9.5);  // wrapper centrado en (0,0,0)
                onModelReady();
            }, undefined, (err) => {
                console.warn('[NeuroAtlas] Spinal Cord no disponible, usando geometría procedural.', err);
                onModelReady();
            });

            // Cráneo: BodyParts3D huesos combinados (CC BY-SA 2.1 Japan, DBCLS)
            // Huesos: frontal, parietal ×2, temporal ×2, occipital, esfenoides, etmoides, zigomático ×2, mandíbula
            if(loaderText) loaderText.innerText = 'Cargando cráneo — BodyParts3D (DBCLS)...';
            gltfLoader.load('./Skull.glb', (gltf) => {
                // Precalcula normales en carga (trimesh no las incluye en GLB)
                gltf.scene.traverse(child => {
                    if(child.isMesh) child.geometry.computeVertexNormals();
                });
                // Normaliza al tamaño objetivo (9 unidades = ligeramente mayor que el cerebro)
                skullGLB = normalizeGLB(gltf.scene, 9.0);
                if(loaderText) loaderText.innerText = 'Atlas anatómico listo';
                onModelReady();
            }, undefined, (err) => {
                console.warn('[NeuroAtlas] Skull.glb no disponible, usando geometría procedural.', err);
                onModelReady();
            });

            // Columna vertebral: BodyParts3D (C3–C7, T1–T12, L1–L5, Sacro) (CC BY-SA 2.1 Japan, DBCLS)
            gltfLoader.load('./Spine.glb?v=20260608f', (gltf) => {
                gltf.scene.traverse(child => {
                    if(child.isMesh) child.geometry.computeVertexNormals();
                });
                spineColumnGLB = normalizeGLB(gltf.scene, 12.0); // 18 vértebras reales
                onModelReady();
            }, undefined, (err) => {
                console.warn('[NeuroAtlas] Spine.glb no disponible, usando geometría procedural.', err);
                onModelReady();
            });
            // ────────────────────────────────────────────────────────────────────

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function setupLighting() {
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const spotLight = new THREE.SpotLight(0xffffff, 2.0);
            spotLight.position.set(5, 15, 10);
            spotLight.angle = Math.PI/4; spotLight.penumbra = 0.5; spotLight.castShadow = true;
            spotLight.shadow.mapSize.width = 2048; spotLight.shadow.mapSize.height = 2048; spotLight.shadow.bias = -0.0005;
            scene.add(spotLight);
            // IMPORTANTE: scene.add() retorna `scene`, no el objeto añadido.
            // Por eso se crean los lights por separado para evitar mover scene.position.
            const dl1 = new THREE.DirectionalLight(0x90b0ff, 0.8);
            dl1.position.set(-10, 5, -10);
            scene.add(dl1);
            const dl2 = new THREE.DirectionalLight(0xffddaa, 0.6);
            dl2.position.set(10, -5, -5);
            scene.add(dl2);
        }

        // --- HELPER PARA VASOS (Splines) ---
        function createVessel(points, radius, material) {
            const curve = new THREE.CatmullRomCurve3(points);
            const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 32, radius, 8, false), material);
            return tube;
        }

        // --- GENERADOR CEREBRO ---
        function generateBrain() {
            animatedMeshes = [];
            const group = new THREE.Group();
            let shiftX = (currentPathology === 'tumor' || currentPathology === 'hematoma') ? 0.3 : 0;

            // 1. CAPA ÓSEA — cráneo real (BodyParts3D CC BY-SA 2.1 Japan / DBCLS)
            if (skullGLB) {
                const skullMesh = skullGLB.clone();
                // Rx(-90°) ya horneado en el GLB (build_skull.py v2) → Y-arriba, anterior en -Z.
                // Solo necesitamos rotation.y = π para que el frontal mire a cámara (+Z).
                skullMesh.rotation.y = Math.PI;
                // Posición: ligeramente más baja que el brain para centrar bóveda craneal
                skullMesh.position.set(0, 0.9, 0);
                skullMesh.traverse(child => {
                    if (!child.isMesh) return;
                    child.material = mats.boneTransp.clone();
                    child.castShadow = true;
                    child.receiveShadow = true;
                    child.userData.layer = 'bone';
                });
                group.add(skullMesh);
            } else {
                // Fallback procedural — semiesfera
                const skull = new THREE.Mesh(new THREE.SphereGeometry(3.6, 64, 64, 0, Math.PI*2, 0, Math.PI*0.6).scale(0.85, 1, 1.1), mats.boneTransp);
                skull.position.set(0, 1.5, 0); skull.userData.layer = 'bone'; group.add(skull);
            }

            // 2. CAPA TEJIDO ────────────────────────────────────────────────────────
            const tissueGroup = new THREE.Group(); tissueGroup.userData.layer = 'tissue';
            const tMat = mats.tissue;

            if (brainGLB) {
                // ── Modelo anatómico real: Allen Institute Brain (HuBMAP CCF Atlas) ──
                const brainMesh = brainGLB.clone();
                brainMesh.position.set(0, 1.5, 0);   // elevar al centro del cráneo
                brainMesh.rotation.y = Math.PI;       // girar 180°Y → lóbulo frontal hacia la cámara (+Z)
                brainMesh.traverse(child => {
                    if(!child.isMesh) return;
                    if(currentPathology === 'stroke')
                        child.material = mats.tissueStroke.clone();
                    else
                        child.material = mats.tissue.clone();
                    child.castShadow = true;
                    child.receiveShadow = true;
                    child.userData.layer = 'tissue';
                });
                tissueGroup.add(brainMesh);
            } else {
                // ── Fallback procedural (si GLB no cargó) ───────────────────────────
                const hemiGeoBase = new THREE.IcosahedronGeometry(3.0, 32); hemiGeoBase.scale(0.8, 1.1, 1.3);
                const pos = hemiGeoBase.attributes.position; const v = new THREE.Vector3();
                for(let i=0; i<pos.count; i++) {
                    v.fromBufferAttribute(pos, i);
                    if(v.x < 0) v.x *= 0.1;
                    if(v.y < -0.5 && v.z > 0.5 && v.x > 1.0) v.y -= 0.4;
                    v.addScaledVector(v.clone().normalize(), pseudo3DNoise(v.x, v.y, v.z) * 0.25);
                    pos.setXYZ(i, v.x, v.y, v.z);
                }
                hemiGeoBase.computeVertexNormals();

                // Hemisferio Izquierdo
                const leftHemi = new THREE.Mesh(hemiGeoBase, tMat); leftHemi.position.set(-1.4, 1.6, 0);
                leftHemi.castShadow = true; leftHemi.receiveShadow = true; tissueGroup.add(leftHemi);

                // Hemisferio Derecho (Patologías)
                const hemiGeoR = hemiGeoBase.clone(); const posR = hemiGeoR.attributes.position;
                for(let i=0; i<posR.count; i++) {
                    let px = -posR.getX(i);
                    if (currentPathology === 'hematoma' && px > 1.0 && posR.getY(i) > 0) px *= 0.6;
                    posR.setX(i, px);
                }
                hemiGeoR.computeVertexNormals();

                let rightMat = tMat;
                if (currentPathology === 'stroke') rightMat = mats.tissueStroke;
                const rightHemi = new THREE.Mesh(hemiGeoR, rightMat); rightHemi.position.set(1.4, 1.6, 0);
                rightHemi.castShadow = true; rightHemi.receiveShadow = true; tissueGroup.add(rightHemi);

                const stem  = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.4, 2.5, 32), tMat); stem.position.set(0, -1.0, -0.5); stem.rotation.x = 0.2;
                const cereb = new THREE.Mesh(new THREE.SphereGeometry(1.6, 64, 32).scale(1.5, 0.5, 1.1), tMat); cereb.position.set(0, -1.2, -2.0);
                tissueGroup.add(stem, cereb);
            }
            // ───────────────────────────────────────────────────────────────────────
            tissueGroup.position.x = shiftX; group.add(tissueGroup);

            // 3. CAPA VASCULAR — Círculo de Willis anatómico + ramas corticales + senos durales
            const vesselsGroup = new THREE.Group(); vesselsGroup.userData.layer = 'vessels';

            // Helper: crea un vaso a partir de coordenadas [x,y,z][] y lo añade al grupo
            const addV = (coords, r, mat) => {
                const pts = coords.map(([x,y,z]) => new THREE.Vector3(x, y, z));
                const v = createVessel(pts, r, mat);
                v.userData.layer = 'vessels';
                vesselsGroup.add(v);
            };
            const A = mats.artery; // rojo — arterias
            const Vn = mats.vein;  // azul — venas / senos durales

            // ── Arterias Vertebrales (entran por foramen magno, posterolateral) ──
            addV([[-0.5,-3.5,-1.0],[-0.4,-2.5,-0.9],[-0.3,-1.5,-1.0]], 0.09, A); // izquierda
            addV([[ 0.5,-3.5,-1.0],[ 0.4,-2.5,-0.9],[ 0.3,-1.5,-1.0]], 0.09, A); // derecha

            // ── Arteria Basilar (fusión de VAs, asciende por tronco encefálico) ─
            addV([[0,-1.2,-1.0],[0,-0.7,-0.9],[0,-0.2,-0.8],[0,0.2,-0.7]], 0.13, A);

            // ── Arterias Cerebelosas Superiores (AICS, desde tercio sup basilar) ─
            addV([[0,-0.2,-0.9],[-1.2,0.1,-1.4],[-1.8,0.3,-1.8]], 0.05, A);
            addV([[0,-0.2,-0.9],[ 1.2,0.1,-1.4],[ 1.8,0.3,-1.8]], 0.05, A);

            // ── PCAs — Arterias Cerebrales Posteriores (P1+P2) ────────────────
            addV([[0,0.2,-0.7],[-1.0,0.3,-1.1],[-1.6,0.7,-1.5],[-2.0,1.2,-1.8]], 0.08, A);
            addV([[0,0.2,-0.7],[ 1.0,0.3,-1.1],[ 1.6,0.7,-1.5],[ 2.0,1.2,-1.8]], 0.08, A);

            // ── PComAs — Arterias Comunicantes Posteriores ────────────────────
            addV([[-0.9,0.3,-1.0],[-1.1,0.1,-0.5],[-1.3,0.0,0.2]], 0.05, A);
            addV([[ 0.9,0.3,-1.0],[ 1.1,0.1,-0.5],[ 1.3,0.0,0.2]], 0.05, A);

            // ── ICAs — Arterias Carótidas Internas (sifón + porción supraclinoidea) ─
            addV([[-1.2,-3.5,0.3],[-1.2,-2.0,0.3],[-1.2,-0.8,0.2],[-1.3,0.0,0.2]], 0.11, A);
            addV([[ 1.2,-3.5,0.3],[ 1.2,-2.0,0.3],[ 1.2,-0.8,0.2],[ 1.3,0.0,0.2]], 0.11, A);

            // ── MCAs — Arterias Cerebrales Medias (M1 horizontal) ────────────
            addV([[-1.3,0.0,0.2],[-2.0,0.3,0.5],[-2.8,0.7,0.8]], 0.10, A);
            addV([[ 1.3,0.0,0.2],[ 2.0,0.3,0.5],[ 2.8,0.7,0.8]], 0.10, A);
            // M2 — segmentos en cisura de Silvio
            addV([[-2.8,0.7,0.8],[-2.8,1.8,1.0],[-2.5,2.8,0.7]], 0.07, A);
            addV([[-2.8,0.7,0.8],[-3.1,1.3,-0.1],[-2.9,2.4,-0.5]], 0.07, A);
            addV([[ 2.8,0.7,0.8],[ 2.8,1.8,1.0],[ 2.5,2.8,0.7]], 0.07, A);
            addV([[ 2.8,0.7,0.8],[ 3.1,1.3,-0.1],[ 2.9,2.4,-0.5]], 0.07, A);
            // M3 — ramas corticales
            addV([[-2.5,2.8,0.7],[-2.0,3.6,0.4],[-1.6,4.1,-0.1]], 0.04, A);
            addV([[-2.9,2.4,-0.5],[-2.4,3.2,-0.8],[-1.8,4.0,-1.0]], 0.04, A);
            addV([[ 2.5,2.8,0.7],[ 2.0,3.6,0.4],[ 1.6,4.1,-0.1]], 0.04, A);
            addV([[ 2.9,2.4,-0.5],[ 2.4,3.2,-0.8],[ 1.8,4.0,-1.0]], 0.04, A);

            // ── ACAs — Arterias Cerebrales Anteriores ─────────────────────────
            // A1 — horizontal (de ICA a comisura anterior)
            addV([[-1.3,0.0,0.2],[-0.7,0.0,0.8],[-0.2,0.0,1.3]], 0.07, A);
            addV([[ 1.3,0.0,0.2],[ 0.7,0.0,0.8],[ 0.2,0.0,1.3]], 0.07, A);
            // AComA — arteria comunicante anterior (transversal diminuta)
            addV([[-0.2,0.0,1.3],[0.0,0.0,1.38],[0.2,0.0,1.3]], 0.04, A);
            // A2 — sube por cisura interhemisférica anterior
            addV([[-0.2,0.0,1.3],[-0.3,1.0,1.8],[-0.4,2.0,2.0],[-0.3,3.2,1.8]], 0.06, A);
            addV([[ 0.2,0.0,1.3],[ 0.3,1.0,1.8],[ 0.4,2.0,2.0],[ 0.3,3.2,1.8]], 0.06, A);
            // A3 — pericallosales (siguen cuerpo calloso hacia posterior)
            addV([[-0.3,3.2,1.8],[-0.5,3.8,0.5],[-0.5,4.0,-0.5]], 0.04, A);
            addV([[ 0.3,3.2,1.8],[ 0.5,3.8,0.5],[ 0.5,4.0,-0.5]], 0.04, A);

            // ── SENOS VENOSOS DURALES (azul) ──────────────────────────────────
            // Seno Sagital Superior — línea media superior, ant→post
            addV([[0,4.0,1.8],[0,4.5,0.8],[0,4.7,0.0],[0,4.5,-1.2],[0,4.0,-2.2]], 0.09, Vn);
            // Seno Recto — vena de Galeno → torcular
            addV([[0,2.0,-0.8],[0,3.0,-1.5],[0,4.0,-2.2]], 0.07, Vn);
            // Vena de Galeno (Magna Vena)
            addV([[0,1.5,-1.0],[0,1.8,-0.9],[0,2.0,-0.8]], 0.06, Vn);
            // Senos Transversos → sigmoideos (mayoría dentro de bóveda posterior)
            addV([[0,4.0,-2.2],[-1.0,3.8,-2.4],[-2.2,2.8,-1.8],[-2.8,1.5,-1.3],[-2.8,-0.3,-0.8]], 0.06, Vn);
            addV([[0,4.0,-2.2],[ 1.0,3.8,-2.4],[ 2.2,2.8,-1.8],[ 2.8,1.5,-1.3],[ 2.8,-0.3,-0.8]], 0.06, Vn);
            // Senos Cavernosos (bilateral, base del cráneo)
            addV([[-1.4,-0.5,-0.3],[-1.2,-0.1,0.0],[-1.1,0.2,0.3]], 0.06, Vn);
            addV([[ 1.4,-0.5,-0.3],[ 1.2,-0.1,0.0],[ 1.1,0.2,0.3]], 0.06, Vn);
            // Venas cerebrales superficiales (Trolard, Labbé → SSS / transversos)
            addV([[-1.5,3.5,1.0],[-0.8,4.2,0.8],[-0.1,4.8,0.3]], 0.03, Vn);
            addV([[-2.0,3.0,0.0],[-1.0,4.0,0.0],[-0.1,4.8,0.0]], 0.03, Vn);
            addV([[ 1.5,3.5,1.0],[ 0.8,4.2,0.8],[ 0.1,4.8,0.3]], 0.03, Vn);
            addV([[ 2.0,3.0,0.0],[ 1.0,4.0,0.0],[ 0.1,4.8,0.0]], 0.03, Vn);
            // Venas cerebrales profundas (talámicas, septales)
            addV([[-0.8,1.5,-0.5],[-0.4,1.8,-0.8],[0.0,2.0,-0.8]], 0.03, Vn);
            addV([[ 0.8,1.5,-0.5],[ 0.4,1.8,-0.8],[0.0,2.0,-0.8]], 0.03, Vn);

            vesselsGroup.position.x = shiftX; group.add(vesselsGroup);

            // 4. CAPA PATOLOGÍA
            const pathGroup = new THREE.Group(); pathGroup.userData.layer = 'pathology';
            if (currentPathology === 'aneurysm') {
                const aneurysm = new THREE.Mesh(new THREE.SphereGeometry(0.38, 32, 32), mats.artery);
                // AComA — arteria comunicante anterior (sitio más común de aneurisma)
                aneurysm.position.set(0.0, 0.0, 1.38);
                animatedMeshes.push({ mesh: aneurysm, type: 'pulse' });
                pathGroup.add(aneurysm); pathGroup.position.x = shiftX;
            } else if (currentPathology === 'tumor') {
                const tumorGeo = new THREE.IcosahedronGeometry(1.5, 16);
                const tp = tumorGeo.attributes.position;
                for(let i=0; i<tp.count; i++) tp.setXYZ(i, tp.getX(i)+(Math.random()-0.5)*0.5, tp.getY(i)+(Math.random()-0.5)*0.5, tp.getZ(i)+(Math.random()-0.5)*0.5);
                tumorGeo.computeVertexNormals();
                const tumor = new THREE.Mesh(tumorGeo, mats.tumor); tumor.position.set(-1.8, 2.0, 0.2);
                animatedMeshes.push({ mesh: tumor, type: 'breath' });
                pathGroup.add(tumor);
            } else if (currentPathology === 'hematoma') {
                const hemGeo = new THREE.SphereGeometry(3.6, 64, 64, 0, Math.PI, 0, Math.PI);
                const hp = hemGeo.attributes.position;
                for(let i=0; i<hp.count; i++) if(hp.getX(i) < 0) hp.setX(i, hp.getX(i) * -0.5); 
                hemGeo.scale(0.15, 1.1, 1.15); hemGeo.computeVertexNormals();
                const hematoma = new THREE.Mesh(hemGeo, mats.hematoma); hematoma.position.set(2.6, 1.6, 0);
                pathGroup.add(hematoma);
            } else if (currentPathology === 'avm') {
                for(let i=0; i<30; i++) {
                    const r = 1.0;
                    vesselsGroup.add(createVessel([
                        new THREE.Vector3((Math.random()-0.5)*r - 1.5, Math.random()*r + 1.5, (Math.random()-0.5)*r + 0.5),
                        new THREE.Vector3((Math.random()-0.5)*r - 1.5, Math.random()*r + 1.5, (Math.random()-0.5)*r + 0.5),
                        new THREE.Vector3((Math.random()-0.5)*r - 1.5, Math.random()*r + 1.5, (Math.random()-0.5)*r + 0.5)
                    ], 0.05, Math.random()>0.5?mats.artery:mats.vein));
                }
            }
            group.add(pathGroup);
            return group;
        }

        // --- GENERADOR COLUMNA ---
        function createAnatomicVertebra(isWedge, isBurst, isStenosis) {
            const vGroup = new THREE.Group();
            
            if (isBurst) {
                for(let i=0; i<12; i++) {
                    const frag = new THREE.Mesh(new THREE.BoxGeometry(0.5+Math.random(), 0.5+Math.random(), 0.5+Math.random()), mats.bone);
                    frag.position.set((Math.random()-0.5)*2, (Math.random()-0.5), 0.5 + (Math.random()-0.5)*1.5);
                    frag.rotation.set(Math.random(), Math.random(), Math.random());
                    if(i<4) frag.position.z -= 1.0; // Retropulsión
                    vGroup.add(frag);
                }
            } else {
                const bodyGeo = new THREE.CylinderGeometry(1.6, 1.6, 1.2, 32);
                bodyGeo.scale(1.2, isWedge ? 0.5 : 1.0, 0.9);
                if (isWedge) bodyGeo.rotateX(0.15); // Acuñamiento
                
                const pos = bodyGeo.attributes.position;
                for(let i=0; i<pos.count; i++) {
                    if(pos.getZ(i) < 0 && Math.abs(pos.getX(i)) < 1.0) pos.setZ(i, pos.getZ(i) + 0.5); 
                }
                bodyGeo.computeVertexNormals();
                const body = new THREE.Mesh(bodyGeo, mats.bone);
                body.position.set(0, 0, 0.6); body.castShadow = true; body.receiveShadow = true;
                vGroup.add(body);
            }

            const pedL = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 1.0).rotateX(Math.PI/2), mats.bone); pedL.position.set(-0.9, 0, -0.2);
            const pedR = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 1.0).rotateX(Math.PI/2), mats.bone); pedR.position.set(0.9, 0, -0.2);
            
            if(isStenosis) {
                // Osteofitos estrechando canal
                const osteoL = new THREE.Mesh(new THREE.SphereGeometry(0.4), mats.bone); osteoL.position.set(-0.6, 0, -0.5);
                const osteoR = new THREE.Mesh(new THREE.SphereGeometry(0.4), mats.bone); osteoR.position.set(0.6, 0, -0.5);
                vGroup.add(osteoL, osteoR);
            }

            const lam = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.6, 0.3), mats.bone); lam.position.set(0, 0, -0.8);
            const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 1.8).rotateX(-Math.PI/2+0.2), mats.bone); sp.position.set(0, -0.3, -1.6);
            const tpL = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 2.5).rotateZ(Math.PI/2), mats.bone); tpL.position.set(-1.2, 0, -0.6); tpL.rotation.y = -0.3;
            const tpR = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 2.5).rotateZ(Math.PI/2), mats.bone); tpR.position.set(1.2, 0, -0.6); tpR.rotation.y = 0.3;
            
            vGroup.add(pedL, pedR, lam, sp, tpL, tpR);
            return vGroup;
        }

        function generateSpine() {
            animatedMeshes = [];
            const group = new THREE.Group();
            const segments = 4; const startY = 3.5; const spacing = 2.4;
            const procCenterY = startY - ((segments-1)*spacing)/2;  // ≈ -0.1

            const boneGroup = new THREE.Group(); boneGroup.userData.layer = 'bone';
            const tissueGroup = new THREE.Group(); tissueGroup.userData.layer = 'tissue';
            const pathGroup = new THREE.Group(); pathGroup.userData.layer = 'pathology';

            // Médula espinal: GLB real o cilindro procedural como fallback
            let cord;
            if(spinalCordGLB) {
                cord = spinalCordGLB.clone();
                cord.traverse(child => {
                    if(!child.isMesh) return;
                    child.material = mats.nerve.clone();
                    child.castShadow = true; child.receiveShadow = true;
                    child.userData.layer = 'tissue';
                });
                // Canal vertebral: ligeramente posterior (-Z) al centro del cuerpo vertebral
                // Rx(-90°) baked → en escena: Z>0=anterior, Z<0=posterior. Canal a ~Z=-0.6
                cord.position.set(0, spineColumnGLB ? 0.5 : procCenterY, -0.6);
            } else {
                cord = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, segments*spacing+1, 32), mats.nerve);
                cord.position.set(0, procCenterY, -0.5);
                cord.userData.layer = 'tissue';
            }
            tissueGroup.add(cord);

            if (spineColumnGLB) {
                // ── Columna real: 22 vértebras BodyParts3D (C1–C7, T1/T5–T12, L1–L5, Sacro) ──
                const spineMesh = spineColumnGLB.clone();
                // Rx(-90°) ya horneado en el GLB; solo giramos Y=π para cámara frontal
                spineMesh.rotation.y = Math.PI;
                spineMesh.position.set(0, 0, 0);
                spineMesh.traverse(child => {
                    if (!child.isMesh) return;
                    child.material = mats.bone.clone();
                    child.castShadow = true;
                    child.receiveShadow = true;
                    child.userData.layer = 'bone';
                });
                boneGroup.add(spineMesh);

                // Nervios radiculares a lo largo de toda la columna (cervical → sacro)
                // Espaciado: 15 pares, desde Y=5.0 (C2) hasta Y=-5.0 (S1)
                for (let i = 0; i < 15; i++) {
                    const nGroup = new THREE.Group();
                    const yN = 5.0 - i * 0.72;
                    // Raíces cervicales son más cortas; lumbares más largas (abanico cauda equina)
                    const isCervical = yN > 2.8;
                    const isLumbar   = yN < -1.5;
                    const len = isCervical ? 1.2 : isLumbar ? 2.2 : 1.7;
                    const angle = isLumbar ? 0.45 : 0.22;
                    const nL = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, len).rotateZ(Math.PI/2), mats.nerve);
                    nL.position.set(-len/2, 0, 0); nL.rotation.y = angle;
                    const nR = nL.clone(); nR.position.set(len/2, 0, 0); nR.rotation.y = -angle;
                    nGroup.add(nL, nR);
                    nGroup.position.set(0, yN, -0.55);
                    tissueGroup.add(nGroup);
                }

                // Marcadores de patología sobre la columna real
                const pY = 1.2; // nivel aproximado toraco-lumbar (zona de mayor carga)
                if (currentPathology === 'hernia') {
                    const hernia = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 32), mats.hernia);
                    hernia.scale.set(1.5, 0.5, 1.5);
                    hernia.position.set(-0.8, pY, 0.2);
                    hernia.rotation.y = 0.5;
                    animatedMeshes.push({mesh: hernia, type: 'glow'});
                    pathGroup.add(hernia);
                } else if (currentPathology === 'wedge' || currentPathology === 'burst') {
                    // Fragmento de compresión anterior
                    const frag1 = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.35, 1.4), mats.bone);
                    frag1.position.set(-0.4, pY + 0.05, 0.3);
                    frag1.rotation.z = currentPathology === 'wedge' ? 0.28 : 0.15;
                    frag1.userData.layer = 'pathology';
                    pathGroup.add(frag1);
                    if (currentPathology === 'burst') {
                        const frag2 = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.25, 0.9), mats.bone);
                        frag2.position.set(0.55, pY + 0.35, 0.55);
                        frag2.rotation.set(0.2, 0.3, -0.12);
                        frag2.userData.layer = 'pathology';
                        pathGroup.add(frag2);
                        const frag3 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.7), mats.bone);
                        frag3.position.set(-0.3, pY - 0.35, -0.3);
                        frag3.rotation.set(-0.15, -0.2, 0.1);
                        frag3.userData.layer = 'pathology';
                        pathGroup.add(frag3);
                    }
                } else if (currentPathology === 'stenosis') {
                    // Ligamento amarillo hipertrófico + osteofito
                    const lig = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.18, 16, 24), mats.hernia);
                    lig.position.set(0, pY, -0.35);
                    lig.scale.set(1.4, 0.9, 1);
                    lig.userData.layer = 'pathology';
                    pathGroup.add(lig);
                    const ost = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), mats.bone);
                    ost.position.set(0.5, pY + 0.4, 0.4);
                    ost.userData.layer = 'pathology';
                    pathGroup.add(ost);
                } else if (currentPathology === 'listesis') {
                    // Espondilolistesis: desplazamiento anterior de vértebra superior
                    const slipFrag = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.0, 1.6), mats.bone);
                    slipFrag.position.set(0, pY + 0.5, 0.7);
                    slipFrag.userData.layer = 'pathology';
                    pathGroup.add(slipFrag);
                } else if (currentPathology === 'avm') {
                    for(let i = 0; i < 8; i++) {
                        const r = 0.8 + i * 0.3;
                        const pts = [];
                        for(let t = 0; t < 20; t++) {
                            const a = (t/20)*Math.PI*2;
                            pts.push(new THREE.Vector3(Math.cos(a)*r*0.3, -3 + i*0.85, Math.sin(a)*r*0.2));
                        }
                        const av = createVessel(pts, 0.06 + i*0.01, mats.artery);
                        av.userData.layer = 'pathology';
                        pathGroup.add(av);
                    }
                }
            } else {
                // ── Fallback procedural: 4 vértebras ──
                for(let i=0; i<segments; i++) {
                    let y = startY - (i*spacing);
                    let z = 0;

                    let isBurst = (currentPathology === 'burst' && i === 1);
                    let isWedge = (currentPathology === 'wedge' && i === 1);
                    let isStenosis = (currentPathology === 'stenosis' && i === 1);

                    if (currentPathology === 'listesis' && i >= 1) { z += 0.8; y -= 0.3; }
                    if (isWedge || isBurst) y -= 0.5;

                    const vert = createAnatomicVertebra(isWedge, isBurst, isStenosis);
                    vert.position.set(0, y, z);
                    boneGroup.add(vert);

                    if(i < segments-1) {
                        const nGroup = new THREE.Group();
                        const nL = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.5).rotateZ(Math.PI/2), mats.nerve); nL.position.set(-1.6, 0, 0); nL.rotation.y = 0.3;
                        const nR = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.5).rotateZ(Math.PI/2), mats.nerve); nR.position.set(1.6, 0, 0); nR.rotation.y = -0.3;
                        nGroup.add(nL, nR); nGroup.position.set(0, y - spacing/2 + 0.3, z - 0.3);
                        tissueGroup.add(nGroup);
                    }

                    if(i < segments-1) {
                        const discGeo = new THREE.CylinderGeometry(1.55, 1.55, 0.4, 32); discGeo.scale(1.2, 1, 0.9);
                        const dp = discGeo.attributes.position;
                        for(let j=0; j<dp.count; j++) if(dp.getZ(j) < 0 && Math.abs(dp.getX(j)) < 1.0) dp.setZ(j, dp.getZ(j) + 0.4);
                        discGeo.computeVertexNormals();
                        const disc = new THREE.Mesh(discGeo, mats.disc);
                        disc.position.set(0, y - spacing/2, z + 0.6);
                        if(isBurst) disc.visible = false;
                        boneGroup.add(disc);

                        if(currentPathology === 'hernia' && i===1) {
                            const hernia = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 32), mats.hernia);
                            hernia.scale.set(1.5, 0.5, 1.5); hernia.position.set(-0.8, y - spacing/2, z); hernia.rotation.y = 0.5;
                            animatedMeshes.push({mesh: hernia, type: 'glow'});
                            pathGroup.add(hernia);
                        }
                    }
                }
            }

            group.add(boneGroup, tissueGroup, pathGroup);
            group.position.y = -1;
            return group;
        }



        // --- GENERADOR (VIAJE PACIENTE - 6 Etapas Hiperdetalladas) ---
        function generateJourney() {
            const group = new THREE.Group();

            // ── Materiales ──────────────────────────────────────────────────────────
            const mMetal     = new THREE.MeshPhysicalMaterial({color: 0xcccccc, metalness: 0.9, roughness: 0.2});
            const mDarkMetal = new THREE.MeshPhysicalMaterial({color: 0x444444, metalness: 0.7, roughness: 0.5});
            const mCloth     = new THREE.MeshPhysicalMaterial({color: 0x3b82f6, roughness: 0.9});
            const mWhite     = new THREE.MeshPhysicalMaterial({color: 0xf3f4f6, roughness: 0.5});
            const mWood      = new THREE.MeshPhysicalMaterial({color: 0x8b5a2b, roughness: 0.8});
            const mGlass     = new THREE.MeshPhysicalMaterial({color: 0x88ccff, transparent: true, opacity: 0.3, transmission: 0.9, roughness: 0.1});
            const mPlant     = new THREE.MeshPhysicalMaterial({color: 0x228b22, roughness: 0.8});
            const mScreenBase= new THREE.MeshPhysicalMaterial({color: 0x111111});
            const mSkin      = new THREE.MeshPhysicalMaterial({color: 0xE0B090, roughness: 0.7});
            const mHair      = new THREE.MeshPhysicalMaterial({color: 0x3c2a1e, roughness: 0.9});
            const mGown      = new THREE.MeshPhysicalMaterial({color: 0x93c5fd, roughness: 0.8});   // bata azul
            const mScrubs    = new THREE.MeshPhysicalMaterial({color: 0x16a34a, roughness: 0.8});   // pijama quirúrgico verde

            // ── Sala (paredes + suelo + techo) ──────────────────────────────────────
            const addRoom = (wallColor, floorColor, ceilColor = 0xeeeeee) => {
                const mW = new THREE.MeshPhysicalMaterial({color: wallColor, roughness: 0.9});
                const mF = new THREE.MeshPhysicalMaterial({color: floorColor, roughness: 0.35, metalness: 0.05});
                const mC = new THREE.MeshPhysicalMaterial({color: ceilColor,  roughness: 0.9});
                const fl = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), mF); fl.rotation.x = -Math.PI/2; fl.position.y = -2;
                const cl = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), mC); cl.rotation.x =  Math.PI/2; cl.position.y = 5.5;
                const wB = new THREE.Mesh(new THREE.PlaneGeometry(20, 8), mW); wB.position.set(0, 1.5, -9);
                const wL = new THREE.Mesh(new THREE.PlaneGeometry(20, 8), mW); wL.rotation.y =  Math.PI/2; wL.position.set(-9, 1.5, 0);
                const wR = new THREE.Mesh(new THREE.PlaneGeometry(20, 8), mW); wR.rotation.y = -Math.PI/2; wR.position.set( 9, 1.5, 0);
                group.add(fl, cl, wB, wL, wR);
            };

            // ── Figura de paciente ───────────────────────────────────────────────────
            // lying=true: recostado; lying=false: sentado
            const createPatient = (lying = true) => {
                const p = new THREE.Group();
                const mk = (geo, mat, px, py, pz, rx=0, ry=0, rz=0) => {
                    const m = new THREE.Mesh(geo, mat); m.position.set(px,py,pz); m.rotation.set(rx,ry,rz); return m;
                };
                // Cabeza
                p.add(mk(new THREE.SphereGeometry(0.28, 16, 12), mSkin, 0, 0, 0));
                // Pelo (semiesfera superior)
                p.add(mk(new THREE.SphereGeometry(0.295, 16, 8, 0, Math.PI*2, 0, Math.PI*0.52), mHair, 0, 0.06, -0.02));
                // Ojos
                const eyeL = mk(new THREE.SphereGeometry(0.04, 8, 6), new THREE.MeshBasicMaterial({color:0x333333}), -0.10, 0.05, 0.24);
                const eyeR = mk(new THREE.SphereGeometry(0.04, 8, 6), new THREE.MeshBasicMaterial({color:0x333333}),  0.10, 0.05, 0.24);
                p.add(eyeL, eyeR);

                if (lying) {
                    // Cuello (extiende en -Z desde la cabeza)
                    p.add(mk(new THREE.CylinderGeometry(0.11,0.13,0.30,10), mSkin,  0, -0.04,-0.42,  Math.PI/2));
                    // Torso
                    p.add(mk(new THREE.CylinderGeometry(0.24,0.20,1.60,12), mGown,  0, -0.08,-1.28,  Math.PI/2));
                    // Brazos
                    p.add(mk(new THREE.CylinderGeometry(0.09,0.08,0.65,8),  mGown, -0.35,-0.06,-1.12, Math.PI/2, 0, 0.28));
                    p.add(mk(new THREE.CylinderGeometry(0.09,0.08,0.65,8),  mGown,  0.35,-0.06,-1.12, Math.PI/2, 0,-0.28));
                    // Antebrazos (piel visible)
                    p.add(mk(new THREE.CylinderGeometry(0.08,0.07,0.55,8),  mSkin, -0.42,-0.06,-1.75, Math.PI/2));
                    p.add(mk(new THREE.CylinderGeometry(0.08,0.07,0.55,8),  mSkin,  0.42,-0.06,-1.75, Math.PI/2));
                    // Piernas
                    p.add(mk(new THREE.CylinderGeometry(0.13,0.11,0.95,10), mGown, -0.18,-0.10,-2.42, Math.PI/2));
                    p.add(mk(new THREE.CylinderGeometry(0.13,0.11,0.95,10), mGown,  0.18,-0.10,-2.42, Math.PI/2));
                    p.add(mk(new THREE.CylinderGeometry(0.10,0.09,0.85,10), mGown, -0.18,-0.10,-3.32, Math.PI/2));
                    p.add(mk(new THREE.CylinderGeometry(0.10,0.09,0.85,10), mGown,  0.18,-0.10,-3.32, Math.PI/2));
                } else {
                    // Sentado (silla de ruedas)
                    p.add(mk(new THREE.CylinderGeometry(0.12,0.14,0.28,10), mSkin, 0,-0.38, 0));
                    p.add(mk(new THREE.CylinderGeometry(0.22,0.20,0.95,12), mGown, 0,-1.03, 0));
                    p.add(mk(new THREE.CylinderGeometry(0.09,0.08,0.65,8),  mGown,-0.32,-0.88,0,0,0, 0.22));
                    p.add(mk(new THREE.CylinderGeometry(0.09,0.08,0.65,8),  mGown, 0.32,-0.88,0,0,0,-0.22));
                    p.add(mk(new THREE.CylinderGeometry(0.13,0.12,0.82,10), mGown,-0.20,-1.62,0.40, Math.PI/2));
                    p.add(mk(new THREE.CylinderGeometry(0.13,0.12,0.82,10), mGown, 0.20,-1.62,0.40, Math.PI/2));
                    p.add(mk(new THREE.CylinderGeometry(0.10,0.09,0.70,10), mGown,-0.20,-2.05,0.60,-Math.PI/3));
                    p.add(mk(new THREE.CylinderGeometry(0.10,0.09,0.70,10), mGown, 0.20,-2.05,0.60,-Math.PI/3));
                }
                return p;
            };

            // ── Figura médico de pie ─────────────────────────────────────────────────
            const createDoctor = () => {
                const d = new THREE.Group();
                const mk = (geo,mat,px,py,pz,rx=0,rz=0) => { const m=new THREE.Mesh(geo,mat); m.position.set(px,py,pz); m.rotation.x=rx; m.rotation.z=rz; return m; };
                d.add(mk(new THREE.SphereGeometry(0.24,14,10),   mSkin,     0, 0,    0));
                d.add(mk(new THREE.SphereGeometry(0.25,14,8,0,Math.PI*2,0,Math.PI*0.5), mHair, 0, 0.04, -0.01));
                d.add(mk(new THREE.CylinderGeometry(0.11,0.13,0.26,10), mSkin,   0,-0.34, 0));
                d.add(mk(new THREE.CylinderGeometry(0.21,0.19,0.90,12), mScrubs, 0,-1.00, 0));
                d.add(mk(new THREE.CylinderGeometry(0.09,0.08,0.62,8),  mScrubs,-0.32,-0.85,0,0, 0.3));
                d.add(mk(new THREE.CylinderGeometry(0.09,0.08,0.62,8),  mScrubs, 0.32,-0.85,0,0,-0.3));
                d.add(mk(new THREE.CylinderGeometry(0.12,0.11,0.90,10), mScrubs,-0.18,-1.88,0));
                d.add(mk(new THREE.CylinderGeometry(0.12,0.11,0.90,10), mScrubs, 0.18,-1.88,0));
                d.add(mk(new THREE.CylinderGeometry(0.10,0.09,0.82,10), mScrubs,-0.18,-2.72,0));
                d.add(mk(new THREE.CylinderGeometry(0.10,0.09,0.82,10), mScrubs, 0.18,-2.72,0));
                return d;
            };

            // ── Props comunes ─────────────────────────────────────────────────────────
            const createBed = () => {
                const bGroup = new THREE.Group();
                const frame = new THREE.Mesh(new THREE.BoxGeometry(3, 0.5, 6), mMetal); frame.position.y = -0.5;
                const matt = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.4, 5.8), mWhite); matt.position.y = 0;
                const sheet = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.45, 4), mCloth); sheet.position.set(0, 0.05, -0.9);
                const pillow = new THREE.Mesh(new THREE.BoxGeometry(2, 0.2, 1.2), mWhite); pillow.position.set(0, 0.3, 2.2);
                const railingL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 4), mMetal); railingL.position.set(-1.5, 0, 0);
                const railingR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 4), mMetal); railingR.position.set(1.5, 0, 0);
                // Headboard
                const hb = new THREE.Mesh(new THREE.BoxGeometry(3, 1.5, 0.12), mMetal); hb.position.set(0, 0.4, 3.06);
                bGroup.add(frame, matt, sheet, pillow, railingL, railingR, hb);
                bGroup.position.y = -1;
                return bGroup;
            };

            const createIVPole = () => {
                const ivGroup = new THREE.Group();
                const base = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.1), mDarkMetal); base.position.y = -1.95;
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 5), mMetal); pole.position.y = 0.5;
                const hook = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.05, 0.05), mMetal); hook.position.y = 2.8;
                const bag1 = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.5), mGlass); bag1.position.set(0.3, 2.4, 0);
                const bag2 = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.4), mWhite); bag2.position.set(-0.3, 2.4, 0);
                ivGroup.add(base, pole, hook, bag1, bag2);
                return ivGroup;
            };

            const createMonitor = (screenColor, addPulse) => {
                const mGroup = new THREE.Group();
                const base = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 0.4), mDarkMetal);
                const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.5), mDarkMetal); stand.position.y = 0.3;
                const box = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.15), mScreenBase); box.position.y = 0.6;
                const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.7), new THREE.MeshBasicMaterial({color: screenColor})); 
                screen.position.set(0, 0.6, 0.08);
                mGroup.add(base, stand, box, screen);
                if (addPulse) animatedMeshes.push({mesh: screen, type: 'ecg'});
                return mGroup;
            };

            const createChair = () => {
                const cGroup = new THREE.Group();
                const seat = new THREE.Mesh(new THREE.BoxGeometry(1, 0.1, 1), mDarkMetal); seat.position.y = -1;
                const back = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.1), mDarkMetal); back.position.set(0, -0.5, -0.45);
                const leg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1), mMetal); leg1.position.set(-0.4, -1.5, -0.4);
                const leg2 = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1), mMetal); leg2.position.set(0.4, -1.5, -0.4);
                const leg3 = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1), mMetal); leg3.position.set(-0.4, -1.5, 0.4);
                const leg4 = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1), mMetal); leg4.position.set(0.4, -1.5, 0.4);
                cGroup.add(seat, back, leg1, leg2, leg3, leg4);
                return cGroup;
            };

            // ── ESCENAS ───────────────────────────────────────────────────────────────
            if (currentPathology === 'admission') {
                addRoom(0xf5efe8, 0xb5b0aa);   // beige cálido — sala de triaje
                group.add(createBed());

                // Paciente recostado en la cama (cabeza al +Z del bed = pillow end)
                const pat = createPatient(true);
                pat.position.set(0, -0.45, 2.1); // sobre la almohada, Z=2.1 en world space
                group.add(pat);

                // Mostrador / Escritorio
                const desk = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 1.5), mWood); desk.position.set(-4, -1.25, 0);
                const pc = createMonitor(0x4488ff, false); pc.position.set(-4, -0.5, 0); pc.rotation.y = Math.PI/4;
                const keyboard = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.05, 0.3), mDarkMetal); keyboard.position.set(-3.5, -0.45, 0.4);
                group.add(desk, pc, keyboard);

                // Sillas de espera
                const chair1 = createChair(); chair1.position.set(4.5, 0, 2); chair1.rotation.y = -Math.PI/2;
                const chair2 = createChair(); chair2.position.set(4.5, 0, 0); chair2.rotation.y = -Math.PI/2;
                const chair3 = createChair(); chair3.position.set(4.5, 0,-2); chair3.rotation.y = -Math.PI/2;
                group.add(chair1, chair2, chair3);

                // Planta decorativa
                const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.3, 0.8), mWhite); pot.position.set(-5, -1.6, -3);
                const plant = new THREE.Mesh(new THREE.DodecahedronGeometry(0.7, 1), mPlant); plant.position.set(-5, -0.8, -3);
                group.add(pot, plant);

                const ivPole = createIVPole(); ivPole.position.set(-2, 0, 2); group.add(ivPole);

                // Médico en triaje
                const doc = createDoctor(); doc.position.set(-2.5, -0.6, 0.5); doc.rotation.y = 0.5;
                group.add(doc);
            }
            else if (currentPathology === 'mri') {
                addRoom(0xf0f0f0, 0xc8c8c0);  // blanco clínico — sala RMN

                const bed = createBed(); bed.scale.set(0.8, 1, 0.8); bed.position.set(0, -1, 3);
                // Paciente en la camilla de RMN (cabeza entrando al gantry)
                const pat = createPatient(true);
                pat.scale.set(0.8, 0.8, 0.8);
                pat.position.set(0, 0.15, 4.8); // sobre la camilla, cabeza hacia el escáner (-Z)
                pat.rotation.y = Math.PI;        // cabeza en dirección -Z → escáner
                group.add(pat);

                // Antena de cabeza RMN (Head Coil)
                const coil = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.1, 16, 32, Math.PI), mWhite);
                coil.position.set(0, 0.2, 2.2); coil.rotation.x = Math.PI/2;
                bed.add(coil);

                // Escáner RMN Principal
                const scannerGrp = new THREE.Group();
                const scannerBody = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 3.5, 4, 32), mWhite);
                scannerBody.rotation.x = Math.PI/2; scannerBody.position.set(0, 0, -2);
                const scannerHole = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 4.1, 32), new THREE.MeshBasicMaterial({color:0x050a0f}));
                scannerHole.rotation.x = Math.PI/2; scannerHole.position.set(0, 0, -2);
                const scannerRingF = new THREE.Mesh(new THREE.TorusGeometry(3.5, 0.25, 16, 48), mMetal); scannerRingF.position.set(0, 0, 0);
                const scannerRingB = new THREE.Mesh(new THREE.TorusGeometry(3.5, 0.25, 16, 48), mMetal); scannerRingB.position.set(0, 0,-4);
                // Interior glow ring
                const innerRing = new THREE.Mesh(new THREE.TorusGeometry(1.3, 0.06, 8, 32), new THREE.MeshBasicMaterial({color:0x4488ff}));
                innerRing.position.set(0, 0, -2);
                scannerGrp.add(scannerBody, scannerHole, scannerRingF, scannerRingB, innerRing);

                // Sala de control (cristal)
                const glassWall = new THREE.Mesh(new THREE.BoxGeometry(10, 5, 0.12), mGlass); glassWall.position.set(-6, 0.5, 0); glassWall.rotation.y = Math.PI/2;
                const controlDesk = new THREE.Mesh(new THREE.BoxGeometry(2, 1.2, 4), mWood); controlDesk.position.set(-8, -1.4, 0);
                const monitor1 = createMonitor(0x003366, false); monitor1.position.set(-8, -0.8, -1); monitor1.rotation.y = Math.PI/2;
                const monitor2 = createMonitor(0x00aa44, false); monitor2.position.set(-8, -0.8,  1); monitor2.rotation.y = Math.PI/2;
                const tech = createDoctor(); tech.position.set(-7.5, -0.6, 0); tech.rotation.y = Math.PI/2;

                group.add(bed, scannerGrp, glassWall, controlDesk, monitor1, monitor2, tech);
            }
            else if (currentPathology === 'surgery') {
                addRoom(0xe8f0e8, 0xa8a8a0);  // verde clínico quirúrgico

                const orTable = new THREE.Group();
                const tFrame = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.15, 6.5), mMetal); tFrame.position.y = -0.5;
                const tPad   = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.20, 6.3), mWhite);
                const tBase  = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.2, 0.8), mDarkMetal); tBase.position.set(0,-1.1, 0);
                orTable.add(tFrame, tPad, tBase); orTable.position.y = -1;
                group.add(orTable);

                // Paciente en mesa quirúrgica
                const pat = createPatient(true);
                pat.position.set(0, -0.45, 2.0);
                group.add(pat);

                // Luces de quirófano (LED circular)
                const lampGroup = new THREE.Group();
                const arm1 = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1.5,8), mMetal); arm1.position.set(0,4.5,0);
                const arm2 = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.8,8), mMetal); arm2.rotation.x=Math.PI/2; arm2.position.set(0,3.7,0.5);
                const lampDome = new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,0.25,32), mWhite); lampDome.position.set(0,3.25,0.5);
                for(let i=0;i<8;i++){
                    const a = (i/8)*Math.PI*2;
                    const b = new THREE.Mesh(new THREE.SphereGeometry(0.18,8,6), new THREE.MeshBasicMaterial({color:0xffffff}));
                    b.position.set(Math.cos(a)*1.0, 3.12, 0.5+Math.sin(a)*1.0);
                    lampGroup.add(b);
                }
                lampGroup.add(arm1, arm2, lampDome);
                group.add(lampGroup);

                // Anestesiólogo + máquina
                const anesGroup = new THREE.Group();
                const aBody = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2, 1.5), mWhite); aBody.position.y = -1;
                const aMon = createMonitor(0x0066cc, false); aMon.position.y = 0;
                const bellows = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.8, 16), mGlass); bellows.position.set(0, 0.4, 0.8);
                anesGroup.add(aBody, aMon, bellows); anesGroup.position.set(-3.5, 0, -2); group.add(anesGroup);

                // Cirujano
                const surg = createDoctor(); surg.position.set(-1.5, -0.6, 0); surg.rotation.y = 0.2;
                const surg2 = createDoctor(); surg2.position.set( 1.5, -0.6, 0); surg2.rotation.y = -0.2;
                group.add(surg, surg2);

                // Mesa de Mayo (instrumental)
                const mayoGrp = new THREE.Group();
                const mTray = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.06, 1.1), mMetal);
                const mPole = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,2), mMetal); mPole.position.y = -1;
                const mBase = new THREE.Mesh(new THREE.BoxGeometry(1.0,0.1,1.0), mMetal); mBase.position.y = -1.95;
                for(const [x,z,l] of [[-0.6,0,0.45],[0,0,0.35],[0.5,0.1,0.28],[-0.2,-0.3,0.22]])
                    mayoGrp.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(0.06,0.02,l),mDarkMetal),{position:{x,y:0.05,z}}));
                mayoGrp.add(mTray, mPole, mBase); mayoGrp.position.set(3.2, 0, 1); group.add(mayoGrp);

                const ivPole = createIVPole(); ivPole.position.set(2, 0, -2); group.add(ivPole);
            }
            else if (currentPathology === 'recovery') {
                addRoom(0xf0f5ff, 0xb0b8c0);  // blanco-azul UCE/UCI

                group.add(createBed());

                // Paciente en UCI
                const pat = createPatient(true);
                pat.position.set(0, -0.45, 2.1);
                group.add(pat);

                // Cortinas de privacidad
                const mCurtain = new THREE.MeshPhysicalMaterial({color:0x93c5fd, roughness:0.9, transparent:true, opacity:0.75});
                const curtainL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 4, 8), mCurtain); curtainL.position.set(-4, 0, 0);
                const curtainR = curtainL.clone(); curtainR.position.set(4, 0, 0);
                group.add(curtainL, curtainR);

                // Monitor de signos vitales (ECG pulsante)
                const vitals = new THREE.Group();
                const vStand = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 4), mMetal);
                const ecg = createMonitor(0x00ff44, true); ecg.position.set(0, 1.5, 0);
                const pump1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.3), mWhite); pump1.position.set(0, 0.5, 0.2);
                const pump2 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.3), mWhite); pump2.position.set(0,-0.2, 0.2);
                vitals.add(vStand, ecg, pump1, pump2); vitals.position.set(-2.2, 0, 2); vitals.rotation.y = Math.PI/4;
                group.add(vitals);

                // Monitor de presión intracraneal (PIC)
                const picMon = createMonitor(0xff6600, false); picMon.position.set(2.5, -0.3, 2); picMon.rotation.y = -Math.PI/5;
                group.add(picMon);

                const ivPole = createIVPole(); ivPole.position.set(-2.5, 0,-1); group.add(ivPole);

                // Mesa de noche
                const nTable = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 1), mWood); nTable.position.set(2.5, -1.4, 2);
                const glass  = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.10, 0.30), mGlass); glass.position.set(2.5, -0.65, 2);
                group.add(nTable, glass);

                // Enfermera de turno
                const nurse = createDoctor(); nurse.position.set(-3.5, -0.6,-0.5); nurse.rotation.y = 0.8;
                group.add(nurse);
            }
            else if (currentPathology === 'rehab') {
                addRoom(0xf5f5e8, 0xc0c0b0);  // beige cálido — sala de rehabilitación

                // Paciente en barras paralelas (de pie, sostenido)
                const pat = createPatient(false); // sentado → postura erguida
                pat.position.set(0, 0.5, 0);     // de pie entre las barras
                group.add(pat);

                // Barras paralelas
                const barsGroup = new THREE.Group();
                const barL = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 6), mMetal); barL.rotation.x = Math.PI/2; barL.position.set(-1, 0, 0);
                const barR = barL.clone(); barR.position.set(1, 0, 0);
                for(const [x,z] of [[-1,-2.5],[-1,2.5],[1,-2.5],[1,2.5]]) {
                    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,2), mMetal); leg.position.set(x,-1,z);
                    barsGroup.add(leg);
                }
                barsGroup.add(barL, barR); barsGroup.position.set(0,0,-1);
                group.add(barsGroup);

                // Fisioterapeuta
                const physio = createDoctor(); physio.position.set(2, -0.6, 0); physio.rotation.y = -0.5;
                group.add(physio);

                // Balón terapéutico
                const ball = new THREE.Mesh(new THREE.SphereGeometry(1.2,32,32), new THREE.MeshPhysicalMaterial({color:0xff4455, roughness:0.2, clearcoat:0.6}));
                ball.position.set(-4, -0.8, 2); group.add(ball);

                // Escalera de terapia (3 escalones)
                const stepsGrp = new THREE.Group();
                for(let i=0;i<3;i++) {
                    const s = new THREE.Mesh(new THREE.BoxGeometry(2, 0.25+i*0.02, 0.9), mWood);
                    s.position.set(0, -2+i*0.28, -i*0.9);
                    stepsGrp.add(s);
                }
                stepsGrp.position.set(4, 0, 2); stepsGrp.rotation.y = -Math.PI/2;
                group.add(stepsGrp);

                // Espejo de pared
                const mirror = new THREE.Mesh(new THREE.BoxGeometry(7, 3.5, 0.08), new THREE.MeshPhysicalMaterial({color:0xeeeeff, metalness:0.95, roughness:0.0}));
                mirror.position.set(0, 0.8, -4.5); group.add(mirror);
            }
            else if (currentPathology === 'discharge') {
                addRoom(0xf0f8f0, 0xb8c8b0);  // verde suave — alta médica / recepción

                // Puerta de salida con cartel verde
                const doorGrp = new THREE.Group();
                const frameL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4.5, 0.4), mMetal); frameL.position.set(-2, 0, 0);
                const frameR = frameL.clone(); frameR.position.set(2, 0, 0);
                const frameT = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.22, 0.4), mMetal); frameT.position.set(0, 2.14, 0);
                const door = new THREE.Mesh(new THREE.BoxGeometry(3.8, 4.2, 0.1), mWood); door.position.set(0, 0, 0);
                const sign = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 0.12), new THREE.MeshBasicMaterial({color: 0x00cc44})); sign.position.set(0, 2.65, 0);
                doorGrp.add(frameL, frameR, frameT, door, sign); doorGrp.position.set(0, 0.1, -5); group.add(doorGrp);

                // Mostrador recepción
                const desk = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 1.5), mWhite); desk.position.set(-4.5, -1.25, 0);
                const pc = createMonitor(0x2255aa, false); pc.position.set(-4.5, -0.5, 0); pc.rotation.y = Math.PI/4;
                group.add(desk, pc);
                // Recepcionista
                const rec = createDoctor(); rec.position.set(-5.5, -0.6, 0); rec.rotation.y = Math.PI/4;
                group.add(rec);

                // Silla de ruedas mejorada
                const wcGrp = new THREE.Group();
                const wL = new THREE.Mesh(new THREE.TorusGeometry(0.65, 0.06, 16, 32), mDarkMetal); wL.position.set(-0.75,-1.35,2); wL.rotation.y = Math.PI/2;
                const wR = wL.clone(); wR.position.set(0.75,-1.35,2);
                const wSmL = new THREE.Mesh(new THREE.TorusGeometry(0.30, 0.05, 12, 24), mDarkMetal); wSmL.position.set(-0.75,-1.35,3.0); wSmL.rotation.y = Math.PI/2;
                const wSmR = wSmL.clone(); wSmR.position.set(0.75,-1.35,3.0);
                const wSeat = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.12, 1.3), mDarkMetal); wSeat.position.set(0,-1,2);
                const wBack = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.3, 0.12), mDarkMetal); wBack.position.set(0,-0.35,1.35);
                const wArm1 = new THREE.Mesh(new THREE.BoxGeometry(0.12,0.12,1.3), mDarkMetal); wArm1.position.set(-0.7,-0.4,2);
                const wArm2 = wArm1.clone(); wArm2.position.set(0.7,-0.4,2);
                const wFoot = new THREE.Mesh(new THREE.BoxGeometry(1.5,0.1,0.25), mDarkMetal); wFoot.position.set(0,-1.5,3.1);
                wcGrp.add(wL,wR,wSmL,wSmR,wSeat,wBack,wArm1,wArm2,wFoot);

                // Paciente sentado en la silla de ruedas
                const pat = createPatient(false);
                pat.position.set(0, 0.0, 2.4);
                wcGrp.add(pat);

                wcGrp.rotation.y = -Math.PI/5; group.add(wcGrp);

                // Plantas / decoración
                const pot1 = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.3, 0.85), mWhite); pot1.position.set(4.5, -1.6, -3);
                const pl1  = new THREE.Mesh(new THREE.DodecahedronGeometry(0.8, 1), mPlant); pl1.position.set(4.5, -0.7, -3);
                const pot2 = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.22, 0.6), mWhite); pot2.position.set(5.5, -1.7, -1);
                const pl2  = new THREE.Mesh(new THREE.SphereGeometry(0.45, 8, 6), mPlant); pl2.position.set(5.5, -1.1, -1);
                group.add(pot1, pl1, pot2, pl2);
            }

            // Aplicar sombra a todos los meshes y evadir filtro de capa poniéndolos todos en 'bone' para este modulo especial
            group.traverse(c => { 
                if(c.isMesh) { 
                    c.userData.layer = 'bone'; 
                    c.castShadow = true; 
                    c.receiveShadow = true; 
                } 
            });
            return group;
        }

        // --- LÓGICA DE UI Y CONTROL ---
        function buildUI() {
            const container = document.getElementById('layer-controls');
            container.innerHTML = '<h2 class="text-[10px] md:text-xs font-bold text-zinc-500 uppercase tracking-widest mb-1 hidden md:block"><i class="fa-solid fa-layer-group mr-2"></i> Sistemas</h2>';
            systemLayers.forEach(layer => {
                const btn = document.createElement('button');
                btn.className = `layer-btn w-full flex items-center gap-3 p-2 md:p-3 rounded-xl text-left ${layer.active ? 'active' : ''}`;
                btn.innerHTML = `<div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style="background-color: ${layer.color}20; color: ${layer.color}"><i class="fa-solid ${layer.icon}"></i></div><span class="text-[10px] md:text-sm font-medium text-zinc-300 hidden md:block">${layer.name}</span>`;
                btn.onclick = () => {
                    layer.active = !layer.active;
                    layer.active ? btn.classList.add('active') : btn.classList.remove('active');
                    activeAnatomyGroup.traverse(child => { if (child.userData.layer === layer.id) child.visible = layer.active; });
                };
